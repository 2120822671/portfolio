<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招财记账 · 个人记账小系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <h1>🐱 招财记账</h1>
    <p class="subtitle">招财猫陪你把每一笔都记得清清楚楚</p>
    <a href="/" style="position:absolute;top:18px;right:20px;color:#666;text-decoration:none;font-size:14px;background:#fff;border:1px solid #e3e3e3;border-radius:16px;padding:6px 14px;">🏠 返回作品集</a>
</header>

<div class="container">

    <!-- 概览卡 -->
    <section class="summary-grid">
        <div class="summary-card income">
            <div class="summary-label">今日收入</div>
            <div class="summary-value" id="sumIncome">¥0.00</div>
        </div>
        <div class="summary-card expense">
            <div class="summary-label">今日支出</div>
            <div class="summary-value" id="sumExpense">¥0.00</div>
        </div>
        <div class="summary-card balance">
            <div class="summary-label">今日结余</div>
            <div class="summary-value" id="sumBalance">¥0.00</div>
        </div>
    </section>

    <!-- 表单 + 宠物区 -->
    <section class="main-grid">
        <div class="card">
            <h2 class="card-title">记一笔账</h2>
            <form id="recordForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="type">类型</label>
                        <select id="type" required>
                            <option value="1">收入</option>
                            <option value="2" selected>支出</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="amount">金额（元）</label>
                        <input type="text" id="amount" inputmode="decimal" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">分类</label>
                        <input type="text" id="category" placeholder="如：餐饮、交通、工资" required>
                    </div>
                    <div class="form-group">
                        <label for="recordTime">账目发生时间</label>
                        <input type="datetime-local" id="recordTime" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="remark">备注（选填）</label>
                    <input type="text" id="remark" placeholder="写点说明，如：午餐牛肉面">
                </div>
                <button type="submit" class="btn-primary">💾 提交记账</button>
            </form>
        </div>

        <div class="pet-card">
            <div class="pet-stage">
                <button class="cat-btn" id="catBtn" aria-label="点击招财猫说话记账">
                    <svg class="cat-float" viewBox="0 0 210 232" width="100%" role="img" aria-label="招财猫">
                        <!-- 尾巴（最底层） -->
                        <g class="cat-tail">
                            <path d="M152 192 q36 -2 32 -36" fill="none" stroke="#2f2b28" stroke-width="16" stroke-linecap="round"/>
                            <path d="M152 192 q36 -2 32 -36" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
                            <circle cx="184" cy="156" r="8" fill="#8d4a32"/>
                        </g>
                        <!-- 头 + 身体（可撸） -->
                        <g data-zone="head">
                            <!-- 耳朵 -->
                            <polygon points="58,72 46,22 100,54" fill="#ffffff" stroke="#2f2b28" stroke-width="6" stroke-linejoin="round"/>
                            <polygon points="66,66 58,36 90,54" fill="#e2543e"/>
                            <polygon points="152,72 164,22 110,54" fill="#8d4a32" stroke="#2f2b28" stroke-width="6" stroke-linejoin="round"/>
                            <polygon points="146,64 154,38 122,54" fill="#e2543e"/>
                            <!-- 身体轮廓 -->
                            <path d="M105 28 C 146 28 164 58 161 94 C 174 104 171 150 159 176 C 149 204 126 212 105 212 C 84 212 61 204 51 176 C 39 150 36 104 49 94 C 46 58 64 28 105 28 Z"
                                  fill="#ffffff" stroke="#2f2b28" stroke-width="6" stroke-linejoin="round"/>
                            <!-- 头顶棕色花斑 -->
                            <path d="M112 32 C 136 38 152 60 156 88 C 144 94 132 86 126 68 C 121 54 116 42 112 32 Z" fill="#8d4a32"/>
                            <!-- 眯眯眼（开心闭眼） -->
                            <path d="M70 98 Q81 84 92 98" fill="none" stroke="#2f2b28" stroke-width="6" stroke-linecap="round"/>
                            <path d="M118 98 Q129 84 140 98" fill="none" stroke="#2f2b28" stroke-width="6" stroke-linecap="round"/>
                            <!-- 腮红 + 腮红胡须点 -->
                            <ellipse cx="60" cy="118" rx="15" ry="10" fill="#fbe3dc"/>
                            <ellipse cx="150" cy="118" rx="15" ry="10" fill="#fbe3dc"/>
                            <g stroke="#d04a38" stroke-width="3" stroke-linecap="round">
                                <line x1="52" y1="113" x2="60" y2="115"/>
                                <line x1="52" y1="121" x2="60" y2="123"/>
                                <line x1="142" y1="115" x2="150" y2="113"/>
                                <line x1="142" y1="123" x2="150" y2="121"/>
                            </g>
                            <!-- 鼻子和嘴 -->
                            <path d="M101 108 h8 l-4 6 z" fill="#e08e7f"/>
                            <path d="M85 120 Q94 133 103 123 Q105 121 105 121 Q107 121 109 123 Q118 133 127 120" fill="none" stroke="#a83a30" stroke-width="3.5" stroke-linecap="round"/>
                            <!-- 胡须 -->
                            <g stroke="#2f2b28" stroke-width="3" stroke-linecap="round" opacity="0.85">
                                <line x1="34" y1="106" x2="52" y2="110"/>
                                <line x1="34" y1="120" x2="52" y2="122"/>
                                <line x1="176" y1="106" x2="158" y2="110"/>
                                <line x1="176" y1="120" x2="158" y2="122"/>
                            </g>
                        </g>
                        <!-- 肚皮（可撸） -->
                        <ellipse data-zone="belly" cx="105" cy="188" rx="36" ry="24" fill="#fff6e8"/>
                        <!-- 项圈 + 铃铛（可碰） -->
                        <path d="M54 150 Q105 170 156 150 L156 164 Q105 184 54 164 Z" fill="#d0302a"/>
                        <g class="cat-bell" data-zone="bell">
                            <circle cx="105" cy="178" r="15" fill="#f0a72e" stroke="#2f2b28" stroke-width="4"/>
                            <line x1="93" y1="179" x2="117" y2="179" stroke="#8a5a12" stroke-width="3"/>
                            <circle cx="105" cy="185" r="3" fill="#8a5a12"/>
                        </g>
                        <!-- 举起的钱爪（可击掌） -->
                        <g class="cat-paw" data-zone="paw">
                            <ellipse cx="180" cy="120" rx="19" ry="25" transform="rotate(14 180 120)" fill="#ffffff" stroke="#2f2b28" stroke-width="6"/>
                            <circle cx="175" cy="108" r="3.2" fill="#c0392b"/>
                            <circle cx="183" cy="105" r="3.2" fill="#c0392b"/>
                            <circle cx="190" cy="111" r="3.2" fill="#c0392b"/>
                            <ellipse cx="182" cy="122" rx="8" ry="6" fill="#c0392b"/>
                        </g>
                        <!-- 招财金牌 -->
                        <g data-zone="coin" transform="rotate(-16 62 172)">
                            <ellipse cx="62" cy="172" rx="25" ry="36" fill="#e8a33d" stroke="#2f2b28" stroke-width="5"/>
                            <ellipse cx="62" cy="172" rx="17" ry="28" fill="none" stroke="#c77f1e" stroke-width="3"/>
                            <text x="62" y="164" text-anchor="middle" font-size="21" font-weight="700" fill="#6b3d0a" font-family="Microsoft YaHei, sans-serif">招</text>
                            <text x="62" y="190" text-anchor="middle" font-size="21" font-weight="700" fill="#6b3d0a" font-family="Microsoft YaHei, sans-serif">财</text>
                        </g>
                        <!-- 左爪搭在牌上 -->
                        <ellipse cx="44" cy="148" rx="16" ry="13" fill="#ffffff" stroke="#2f2b28" stroke-width="5" transform="rotate(-14 44 148)"/>
                        <!-- 脚 -->
                        <ellipse cx="82" cy="208" rx="15" ry="10" fill="#ffffff" stroke="#2f2b28" stroke-width="5"/>
                        <ellipse cx="128" cy="208" rx="15" ry="10" fill="#ffffff" stroke="#2f2b28" stroke-width="5"/>
                        <ellipse cx="82" cy="208" rx="6" ry="4" fill="#c0392b"/>
                        <ellipse cx="128" cy="208" rx="6" ry="4" fill="#c0392b"/>
                    </svg>
                </button>

                <div style="display:flex;flex-direction:column;align-items:center;">
                    <button class="woodfish-btn" id="woodfishBtn" aria-label="敲一敲木鱼">
                        <svg class="woodfish" viewBox="0 0 120 120" width="100%" role="img" aria-label="木鱼">
                            <ellipse cx="60" cy="86" rx="42" ry="10" fill="#f0dcc0" opacity="0.55"/>
                            <path d="M18 78 q0 -34 42 -40 q42 6 42 40 q-6 24 -42 24 q-36 0 -42 -24 z" fill="#a9702f" stroke="#8a561f" stroke-width="2"/>
                            <path d="M30 72 q0 -22 30 -26 q30 4 30 26 q-4 16 -30 16 q-26 0 -30 -16 z" fill="#c98a46"/>
                            <path d="M40 70 q10 -12 20 -12 q10 0 20 12" fill="none" stroke="#e0aa6c" stroke-width="2"/>
                            <path d="M54 78 q6 -6 12 0" fill="none" stroke="#8a561f" stroke-width="2"/>
                            <ellipse cx="60" cy="70" rx="13" ry="8" fill="#7d4c17" opacity="0.5"/>
                            <g class="mallet">
                                <rect x="70" y="14" width="6" height="42" rx="3" fill="#b9864a" transform="rotate(18 73 35)"/>
                                <circle cx="88" cy="20" r="10" fill="#c98a46" stroke="#8a561f" stroke-width="1.6"/>
                            </g>
                        </svg>
                    </button>
                    <div class="merit-label">今日功德 <span id="meritCount">0</span></div>
                    <button class="merit-clear" id="meritClear">清零</button>
                </div>
            </div>
                <div class="merit-label">今日撸猫 <span id="petCount">0</span> 次</div>
                <button class="btn-ghost" id="catChatBtn" style="padding:7px 16px;font-size:13px;">💬 跟猫说流水</button>
                <div class="pet-hint">摸摸头、撸撸肚子、碰碰铃铛、和它击个掌 · 敲木鱼解压</div>
        </div>
    </section>

    <!-- 流水列表 -->
    <section class="card list-card">
        <h2 class="card-title">收支流水</h2>

        <div class="filter-bar">
            <input type="text" id="fKeyword" placeholder="搜索分类或备注…">
            <select id="fType">
                <option value="">全部类型</option>
                <option value="1">收入</option>
                <option value="2">支出</option>
            </select>
            <input type="date" id="fStart" aria-label="开始日期">
            <input type="date" id="fEnd" aria-label="结束日期">
            <button class="btn-ghost" id="btnSearch">🔍 查询</button>
            <button class="btn-ghost" id="btnReset">重置</button>
        </div>

        <div class="table-wrap" id="recordList">
            <div class="empty-tip">数据加载中…</div>
        </div>

        <div class="pagination">
            <div class="page-info" id="pageInfo"></div>
            <div class="page-btns" id="pageBtns"></div>
        </div>
    </section>
</div>

<!-- 抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
        <h3 id="drawerTitle">记录详情</h3>
        <button class="icon-btn" id="drawerClose" aria-label="关闭">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- 招财猫对话 -->
<div class="cat-chat" id="catChat" aria-hidden="true">
    <div class="chat-head">
        <span class="chat-avatar">🐱</span>
        <div>
            <strong>招财猫</strong>
            <span class="chat-sub">跟我说说今天花了什么</span>
        </div>
        <button class="icon-btn" id="chatClose" aria-label="关闭对话">✕</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-chips" id="chatChips">
        <button data-text="午饭 30">午饭 30</button>
        <button data-text="打车 15 元">打车 15 元</button>
        <button data-text="工资 8000">工资 8000</button>
        <button data-text="今天花了多少">今天花了多少</button>
    </div>
    <div class="chat-input">
        <input type="text" id="chatText" placeholder="例如：午饭花了 30 元" autocomplete="off">
        <button id="chatSend">发送</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
