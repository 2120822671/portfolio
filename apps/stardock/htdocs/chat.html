<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粉丝团聊天 —— 星坞</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h2 style="margin-bottom:16px">💬 <span id="clubTitle">粉丝团聊天</span></h2>
    <div class="chat-container">
      <div class="chat-messages" id="msgList"></div>
      <div class="chat-input">
        <input type="text" id="msgInput" placeholder="说点什么..." maxlength="1000">
        <button class="btn" onclick="sendMsg()">发送</button>
      </div>
    </div>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    let user = null;
    let clubId = null;
    let ws = null;

    (async () => {
      try {
        user = await requireRole();
        await loadNavbar();

        const params = new URLSearchParams(location.search);
        clubId = params.get("club_id");
        if (!clubId) { alert("参数错误"); location.href = "/stardock/home.html"; return; }

        await loadHistory();
        connectWS();
      } catch (e) {}
    })();

    async function loadHistory() {
      try {
        const res = await fetchJSON(`/api/chat/${clubId}/history?size=50`);
        const list = res.data;
        const html = list.map(renderMsg).join("");
        document.getElementById("msgList").innerHTML = html;
        document.getElementById("msgList").scrollTop = 99999;
      } catch (e) {}
    }

    function renderMsg(m) {
      // 用 textContent 防 XSS
      const cls = m.user_id === user.id ? "mine" : "";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = m.nickname;

      const content = document.createElement("span");
      content.className = "content";
      content.textContent = m.content;

      const div = document.createElement("div");
      div.className = `chat-msg ${cls}`;
      div.appendChild(name);
      div.appendChild(document.createElement("br"));
      div.appendChild(content);
      return div.outerHTML;
    }

    function appendMsg(payload) {
      const m = payload.data;
      const cls = m.user_id === user.id ? "mine" : "";

      const div = document.createElement("div");
      div.className = `chat-msg ${cls}`;

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = m.nickname;

      const content = document.createElement("span");
      content.className = "content";
      content.textContent = m.content;

      div.appendChild(name);
      div.appendChild(document.createElement("br"));
      div.appendChild(content);

      const list = document.getElementById("msgList");
      list.appendChild(div);
      list.scrollTop = list.scrollHeight;
    }

    function connectWS() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${proto}//${location.host}/stardock/ws/chat/${clubId}?user_id=${user.id}`;
      ws = new WebSocket(wsUrl);

      ws.onmessage = ev => {
        try {
          const payload = JSON.parse(ev.data);
          if (payload.type === "message") appendMsg(payload);
        } catch (e) {}
      };

      ws.onclose = () => {
        // 3 秒后重连
        setTimeout(connectWS, 3000);
      };
    }

    function sendMsg() {
      const input = document.getElementById("msgInput");
      const content = input.value.trim();
      if (!content || !ws) return;
      ws.send(JSON.stringify({ content }));
      input.value = "";
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMsg();
    });
  </script>
</body>
</html>
