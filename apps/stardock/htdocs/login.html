<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星坞 StarDock —— 登录</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
</head>
<body>
  <div class="auth-box">
    <h1>⭐ 星坞 StarDock</h1>
    <div class="form-group">
      <label>账号</label>
      <input type="text" id="username" placeholder="请输入账号">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button class="btn" style="width:100%" onclick="doLogin()">登 录</button>
    <p style="text-align:center;margin-top:16px;font-size:14px">
      还没有账号？<a href="/stardock/register.html">去注册</a>
    </p>
    <p style="text-align:center;margin-top:8px;font-size:12px;color:#aaa">
      默认管理员 admin / 123456
    </p>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!username || !password) { alert("账号和密码不能为空"); return; }

      try {
        const res = await fetchJSON("/api/auth/login", {
          method: "POST",
          body: { username, password }
        });
        alert("登录成功！");
        window.location.href = "/stardock/home.html";
      } catch (e) { /* fetchJSON 里已经 alert 过了 */ }
    }

    // 回车登录
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
