<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的图鉴 —— 星坞</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h2 style="margin-bottom:16px">📖 我的图鉴</h2>

    <div style="margin-bottom:16px;display:flex;gap:8px;align-items:center">
      <span>筛选稀有度：</span>
      <button class="btn btn-sm" onclick="filterCards(0)">全部</button>
      <button class="btn btn-sm" onclick="filterCards(1)">N</button>
      <button class="btn btn-sm" onclick="filterCards(2)">R</button>
      <button class="btn btn-sm" onclick="filterCards(3)">SR</button>
      <button class="btn btn-sm" onclick="filterCards(4)">SSR</button>
    </div>

    <div id="cardList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px"></div>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    (async () => {
      try {
        await requireRole();
        await loadNavbar();
        await filterCards(0);
      } catch (e) {}
    })();

    async function filterCards(rarity) {
      const url = rarity > 0 ? `/api/gacha/my-cards?rarity=${rarity}&size=100` : `/api/gacha/my-cards?size=100`;
      try {
        const res = await fetchJSON(url);
        const list = res.data;
        document.getElementById("cardList").innerHTML = list.map(c => `
          <div class="card-reveal rarity-${c.rarity}" style="text-align:center;animation:none">
            <div style="font-size:14px">${c.rarity_name}</div>
            <div style="font-weight:bold;margin-top:4px">${c.name}</div>
            <div style="font-size:12px;margin-top:4px">×${c.count}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.7);margin-top:4px">获得于 ${fmt(c.obtain_time)}</div>
          </div>
        `).join("") || "<p>还没有收集到任何卡片~快去抽卡吧！</p>";
      } catch (e) {}
    }
  </script>
</body>
</html>
