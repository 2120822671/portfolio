<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明星详情 —— 星坞</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div class="card" id="detailArea" style="display:none">
      <div id="stageName" style="font-size:28px;font-weight:bold;color:#ffd700"></div>
      <div id="category" style="color:#aaa;margin:4px 0"></div>
      <div id="bio" style="margin:12px 0;line-height:1.6"></div>
      <div style="margin-top:16px;display:flex;gap:12px;align-items:center">
        <span>👥 <span id="fanCount">0</span> 粉丝</span>
        <span>🎤 粉丝团：<span id="clubName"></span></span>
      </div>
      <div id="actionArea" style="margin-top:20px"></div>
    </div>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    let user = null;
    let clubId = null;
    let memberCount = 0;

    (async () => {
      try {
        user = await requireRole();
        await loadNavbar();

        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        if (!id) { alert("参数错误"); location.href = "/stardock/home.html"; return; }
        await loadDetail(id);
      } catch (e) {}
    })();

    async function loadDetail(id) {
      try {
        const res = await fetchJSON(`/api/celebrities/${id}`);
        const c = res.data;
        clubId = c.club_id;
        memberCount = c.member_count || 0;

        setText("stageName", c.stage_name);
        setText("category", c.category);
        setText("bio", c.bio || "这位明星还没有简介~");
        setText("fanCount", c.fan_count || 0);
        setText("clubName", c.club_name || "暂未创建");
        document.getElementById("detailArea").style.display = "block";

        // 查当前用户是否已加入
        const joined = await checkJoined();
        renderActions(joined);
      } catch (e) {}
    }

    async function checkJoined() {
      // 简化：直接查粉丝团详情里的 members 里有没有我
      if (!clubId) return false;
      try {
        const res = await fetchJSON(`/api/fan-clubs/${clubId}`);
        return res.data.members.some(m => m.id === user.id);
      } catch (e) { return false; }
    }

    function renderActions(joined) {
      const area = document.getElementById("actionArea");
      if (joined) {
        area.innerHTML = `
          <a href="/stardock/chat.html?club_id=${clubId}" class="btn">💬 进入粉丝团聊天</a>
          <button class="btn btn-danger btn-sm" onclick="leaveClub()" style="margin-left:8px">退出粉丝团</button>
        `;
      } else {
        area.innerHTML = `<button class="btn" onclick="joinClub()">加入粉丝团</button>`;
      }
    }

    async function joinClub() {
      try {
        await fetchJSON(`/api/fan-clubs/${clubId}/join`, { method: "POST" });
        alert("加入成功！");
        renderActions(true);
      } catch (e) {}
    }

    async function leaveClub() {
      if (!confirm("确定要退出吗？")) return;
      try {
        await fetchJSON(`/api/fan-clubs/${clubId}/leave`, { method: "POST" });
        alert("已退出");
        renderActions(false);
      } catch (e) {}
    }
  </script>
</body>
</html>
