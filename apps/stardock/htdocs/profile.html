<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 —— 星坞</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h2 style="margin-bottom:16px">👤 个人中心</h2>
    <div class="card">
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="username" disabled>
      </div>
      <div class="form-group">
        <label>角色</label>
        <input type="text" id="role" disabled>
      </div>
      <div class="form-group">
        <label>积分</label>
        <input type="text" id="score" disabled>
      </div>
      <div class="form-group">
        <label>昵称（可修改）</label>
        <input type="text" id="nickname">
      </div>
      <button class="btn" onclick="saveProfile()">保存</button>
    </div>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    (async () => {
      try {
        const u = await requireRole();
        await loadNavbar();

        setText("username", u.username);
        setText("role", {1:"粉丝",2:"管理员",3:"明星"}[u.role]);
        setText("score", u.score);
        document.getElementById("nickname").value = u.nickname;
      } catch (e) {}
    })();

    async function saveProfile() {
      const nickname = document.getElementById("nickname").value.trim();
      if (!nickname) { alert("昵称不能为空"); return; }
      try {
        await fetchJSON("/api/users/me", {
          method: "PUT",
          body: { nickname }
        });
        alert("保存成功");
        await loadNavbar();
      } catch (e) {}
    }
  </script>
</body>
</html>
