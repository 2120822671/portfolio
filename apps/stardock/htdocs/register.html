<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星坞 StarDock —— 注册</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
</head>
<body>
  <div class="auth-box">
    <h1>⭐ 星坞 注册</h1>
    <div class="form-group">
      <label>账号（≥3 位）</label>
      <input type="text" id="username" placeholder="登录用的账号">
    </div>
    <div class="form-group">
      <label>密码（≥6 位）</label>
      <input type="password" id="password" placeholder="至少 6 位">
    </div>
    <div class="form-group">
      <label>昵称（显示用）</label>
      <input type="text" id="nickname" placeholder="想叫什么名字？">
    </div>
    <button class="btn" style="width:100%" onclick="doRegister()">注 册</button>
    <p style="text-align:center;margin-top:16px;font-size:14px">
      已有账号？<a href="/stardock/login.html">去登录</a>
    </p>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    async function doRegister() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const nickname = document.getElementById("nickname").value.trim();
      if (!username || !password || !nickname) { alert("请填写完整"); return; }

      try {
        await fetchJSON("/api/auth/register", {
          method: "POST",
          body: { username, password, nickname }
        });
        alert("注册成功！请登录");
        window.location.href = "/stardock/login.html";
      } catch (e) { /* fetchJSON 里 alert 过了 */ }
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doRegister();
    });
  </script>
</body>
</html>
