<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡池配置 —— 星坞</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h2 style="margin-bottom:16px">🎴 卡池配置</h2>

    <div class="card" id="poolArea" style="display:none">
      <h3 id="poolName"></h3>
      <p id="poolDesc" style="color:#aaa"></p>
      <div style="margin:12px 0">
        <button class="btn btn-sm" onclick="togglePool()">启用/关闭</button>
        <button class="btn btn-sm btn-secondary" onclick="showAddCard()">+ 添加卡片</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th><th>名称</th><th>稀有度</th><th>权重</th><th>图片</th><th>描述</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="cardTbody"></tbody>
      </table>
    </div>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    let currentPool = null;

    (async () => {
      try {
        await requireRole([2]);
        await loadNavbar();
        const params = new URLSearchParams(location.search);
        const id = params.get("pool_id");
        if (id) await loadPool(id);
      } catch (e) {}
    })();

    async function loadPool(poolId) {
      try {
        const res = await fetchJSON(`/api/gacha/pools/${poolId}`);
        const p = res.data;
        currentPool = p;
        document.getElementById("poolArea").style.display = "block";
        setText("poolName", `${p.name} (${p.is_active === 1 ? "开启" : "关闭"})`);
        setText("poolDesc", p.description || "");

        const rarityMap = { 1: "N", 2: "R", 3: "SR", 4: "SSR" };
        document.getElementById("cardTbody").innerHTML = (p.cards || []).map(c => `
          <tr>
            <td>${c.id}</td>
            <td>${c.name}</td>
            <td>${rarityMap[c.rarity]}</td>
            <td>${c.weight}</td>
            <td>${c.image_url}</td>
            <td>${c.description || ""}</td>
            <td>
              <button class="btn btn-sm btn-danger" data-cid="${c.id}">删除</button>
            </td>
          </tr>
        `).join("");

        document.querySelectorAll("#cardTbody button[data-cid]").forEach(btn => {
          btn.addEventListener("click", async () => {
            if (!confirm("确定删除这张卡？")) return;
            try {
              await fetchJSON(`/api/gacha/cards/${btn.dataset.cid}`, { method: "DELETE" });
              await loadPool(poolId);
            } catch (e) {}
          });
        });
      } catch (e) {}
    }

    async function togglePool() {
      if (!currentPool) return;
      const newStatus = currentPool.is_active === 1 ? 0 : 1;
      try {
        await fetchJSON(`/api/gacha/pools/${currentPool.id}`, {
          method: "PUT", body: { is_active: newStatus }
        });
        await loadPool(currentPool.id);
      } catch (e) {}
    }

    function showAddCard() {
      const rarity = prompt("稀有度 (1=N, 2=R, 3=SR, 4=SSR):", "2");
      if (!rarity) return;
      const weight = prompt("权重:", "100");
      const name = prompt("卡片名称:");
      if (!name) return;
      const image_url = prompt("图片 URL:", "/stardock/img/card/new.jpg");

      fetchJSON("/api/gacha/cards", {
        method: "POST",
        body: {
          pool_id: currentPool.id,
          name, image_url,
          rarity: parseInt(rarity),
          weight: parseInt(weight) || 100,
          description: ""
        }
      }).then(() => loadPool(currentPool.id));
    }
  </script>
</body>
</html>
