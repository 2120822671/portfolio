<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 —— 星坞</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h2 style="margin-bottom:16px">🛡️ 用户管理</h2>

    <div style="margin-bottom:16px;display:flex;gap:8px">
      <input type="text" id="keyword" placeholder="搜索用户名/昵称" style="flex:1;padding:8px;border-radius:6px;border:none;background:rgba(255,255,255,0.1);color:#fff">
      <select id="filterRole" style="padding:8px;border-radius:6px;border:none;background:rgba(255,255,255,0.1);color:#fff">
        <option value="">全部角色</option>
        <option value="1">粉丝</option>
        <option value="2">管理员</option>
        <option value="3">明星</option>
      </select>
      <button class="btn btn-sm" onclick="loadList()">查询</button>
    </div>

    <div class="card" style="padding:0;overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>账号</th><th>昵称</th><th>角色</th><th>积分</th><th>状态</th><th>注册时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    const roleMap = { 1: "粉丝", 2: "管理员", 3: "明星" };
    const statusMap = { 0: "禁用", 1: "正常" };

    (async () => {
      try {
        await requireRole([2]);
        await loadNavbar();
        await loadList();
      } catch (e) {}
    })();

    async function loadList() {
      const kw = document.getElementById("keyword").value.trim();
      const role = document.getElementById("filterRole").value;
      const params = new URLSearchParams();
      if (kw) params.set("keyword", kw);
      if (role) params.set("role", role);

      try {
        const res = await fetchJSON("/api/users?" + params.toString());
        const list = res.data;
        document.getElementById("tbody").innerHTML = list.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.username}</td>
            <td>${u.nickname}</td>
            <td>${roleMap[u.role] || "?"}</td>
            <td>${u.score}</td>
            <td>${statusMap[u.status]}</td>
            <td>${fmt(u.create_time)}</td>
            <td>
              <button class="btn btn-sm ${u.status === 1 ? "btn-danger" : ""}" data-action="toggle-status" data-id="${u.id}" data-status="${u.status}">
                ${u.status === 1 ? "禁用" : "启用"}
              </button>
              <button class="btn btn-sm btn-secondary" data-action="toggle-role" data-id="${u.id}" data-role="${u.role}">
                切角色
              </button>
            </td>
          </tr>
        `).join("");

        document.querySelectorAll("button[data-action]").forEach(btn => {
          btn.addEventListener("click", () => handleAction(btn.dataset));
        });
      } catch (e) {}
    }

    async function handleAction(data) {
      if (data.action === "toggle-status") {
        const newStatus = data.status === "1" ? 0 : 1;
        try {
          await fetchJSON(`/api/users/${data.id}/status`, {
            method: "PUT", body: { status: newStatus }
          });
          await loadList();
        } catch (e) {}
      } else if (data.action === "toggle-role") {
        const roles = [1, 2, 3];
        const idx = roles.indexOf(parseInt(data.role));
        const next = roles[(idx + 1) % 3];
        if (!confirm(`确定要把用户升级为 ${roleMap[next]} 吗？`)) return;
        try {
          await fetchJSON(`/api/users/${data.id}/role`, {
            method: "PUT", body: { role: next }
          });
          alert("角色已更新");
          await loadList();
        } catch (e) {}
      }
    }
  </script>
</body>
</html>
