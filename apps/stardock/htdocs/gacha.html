<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽卡 —— 星坞</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <h2 style="margin-bottom:16px">🎴 抽卡</h2>

    <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap" id="poolTabs"></div>

    <div id="poolArea" class="card" style="display:none">
      <h3 id="poolName"></h3>
      <p id="poolDesc" style="color:#aaa;margin:8px 0"></p>
      <div style="margin:16px 0">
        <button class="btn" onclick="doDraw(1)" id="draw1Btn">单抽 💎 <span id="cost1">100</span></button>
        <button class="btn btn-secondary" onclick="doDraw(10)" id="draw10Btn" style="margin-left:12px">十连 💎 <span id="cost10">900</span></button>
      </div>
    </div>

    <div id="resultArea" style="margin-top:24px;display:none">
      <h3>✨ 抽卡结果 ✨</h3>
      <div id="resultCards"></div>
    </div>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    let user = null;
    let currentPool = null;

    (async () => {
      try {
        user = await requireRole();
        await loadNavbar();
        await loadPools();
      } catch (e) {}
    })();

    async function loadPools() {
      try {
        const res = await fetchJSON("/api/gacha/pools");
        const pools = res.data;

        document.getElementById("poolTabs").innerHTML = pools.map(p => `
          <button class="btn ${p.is_active === 1 ? "" : "btn-secondary"}" data-id="${p.id}" ${p.is_active !== 1 ? "disabled" : ""}>
            ${p.name}
          </button>
        `).join("");

        // 点击切换
        document.querySelectorAll("#poolTabs button").forEach(btn => {
          btn.addEventListener("click", () => loadPoolDetail(btn.dataset.id));
        });

        // 默认加载第一个激活的
        const active = pools.find(p => p.is_active === 1);
        if (active) await loadPoolDetail(active.id);
      } catch (e) {}
    }

    async function loadPoolDetail(poolId) {
      try {
        const res = await fetchJSON(`/api/gacha/pools/${poolId}`);
        const p = res.data;
        currentPool = p;
        document.getElementById("poolArea").style.display = "block";
        setText("poolName", p.name);
        setText("poolDesc", p.description || "");
        setText("cost1", p.cost_per_draw);
        setText("cost10", p.cost_per_ten);
      } catch (e) {}
    }

    async function doDraw(count) {
      if (!currentPool) { toast("请先选择卡池", "warn"); return; }
      if (currentPool.is_active !== 1) { toast("卡池已关闭", "warn"); return; }

      const btn = document.getElementById(count === 1 ? "draw1Btn" : "draw10Btn");
      btnLoading(btn, true, "抽取中...");

      try {
        const res = await fetchJSON("/api/gacha/draw", {
          method: "POST",
          body: { pool_id: currentPool.id, count }
        });
        showResult(res.data.drawn);
        // 轻量更新积分（零网络请求，也不重绘导航栏）
        updateUserScore(res.data.remain_score);
      } catch (e) {
        // fetchJSON 已经 toast
      } finally {
        btnLoading(btn, false);
        btn.innerHTML = count === 1
          ? `单抽 💎 <span id="cost1">${currentPool.cost_per_draw}</span>`
          : `十连 💎 <span id="cost10">${currentPool.cost_per_ten}</span>`;
      }
    }

    function showResult(drawn) {
      document.getElementById("resultArea").style.display = "block";
      const html = drawn.map(c => `
        <div class="card-reveal rarity-${c.rarity}">
          <div style="font-size:12px">${c.rarity_name}</div>
          <div style="font-weight:bold">${c.name}</div>
        </div>
      `).join("");
      document.getElementById("resultCards").innerHTML = html;
    }
  </script>
</body>
</html>
