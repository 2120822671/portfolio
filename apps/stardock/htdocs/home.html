<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星坞 StarDock —— 首页</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
  <style>
    /* 搜索栏 */
    .hero-search {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .hero-search input {
      flex: 1;
      min-width: 200px;
      padding: 14px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255,215,0,0.2);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 15px;
      transition: all 0.2s;
    }
    .hero-search input:focus { border-color: var(--star-gold); box-shadow: 0 0 0 3px rgba(255,215,0,0.12); }
    .hero-search input::placeholder { color: rgba(255,255,255,0.4); }
    .hero-search .btn { padding: 14px 32px; border-radius: 30px; font-weight: 700; font-size: 15px; }

    /* 活动横幅 */
    .activity-bar {
      position: relative;
      background:
        linear-gradient(135deg, rgba(255,143,0,0.2), rgba(255,215,0,0.12)),
        radial-gradient(circle at 80% 50%, rgba(0,229,255,0.08), transparent);
      border: 1px solid rgba(255,215,0,0.35);
      border-radius: 16px;
      padding: 20px 28px;
      margin-bottom: 28px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      animation: actIn 0.5s ease;
    }
    @keyframes actIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .activity-bar::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--star-gold), var(--star-rose), var(--star-gold), transparent);
    }
    .act-tag {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-right: 10px;
    }
    .act-tag.type-1 { background: linear-gradient(135deg, #2196f3, #1565c0); color: #fff; }
    .act-tag.type-2 { background: linear-gradient(135deg, #ff5722, #d84315); color: #fff; }
    .act-title { font-weight: 700; font-size: 17px; margin-bottom: 8px; }
    .act-content {
      color: var(--text-secondary); font-size: 14px;
      margin-bottom: 10px; white-space: pre-wrap; line-height: 1.6;
    }
    .act-meta {
      display: flex; gap: 18px; flex-wrap: wrap;
      font-size: 12px; color: var(--text-muted);
    }
    .act-pager {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      display: flex; gap: 8px; align-items: center;
    }
    .act-pager button {
      width: 32px; height: 32px;
      border-radius: 50%; border: none;
      background: rgba(255,255,255,0.12); color: #fff;
      cursor: pointer; font-size: 13px;
      transition: all 0.2s;
    }
    .act-pager button:hover { background: rgba(255,215,0,0.3); }
    .act-pager .indicator {
      font-size: 12px; color: var(--star-gold);
      font-weight: 600; min-width: 42px; text-align: center;
    }

    /* 分节标题 */
    .section-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 700;
      margin-bottom: 20px;
    }
    .section-title::before {
      content: "";
      width: 4px; height: 24px;
      background: linear-gradient(180deg, var(--star-gold), var(--star-rose));
      border-radius: 2px;
    }
  </style>
</head>
<body>
<a href="/" class="portal-back" style="position:fixed;left:14px;bottom:14px;z-index:9999;background:#b388ff;color:#1a1035;text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35)">← 作品集</a>
  <div id="navbar"></div>
  <div class="container">
    <!-- 活动横幅 -->
    <div id="activityArea"></div>

    <!-- 标题 + 搜索 -->
    <div class="section-title">🌟 明星 / 主播 列表</div>
    <div class="hero-search">
      <input type="text" id="keyword" placeholder="🔍 搜索明星、主播艺名...">
      <button class="btn" onclick="loadList()">搜索</button>
    </div>

    <div id="listArea" class="celebrity-grid"></div>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    let user = null;
    let activities = [];
    let actIdx = 0;
    let actTimer = null;

    (async () => {
      try {
        user = await requireRole();
        await loadNavbar();
        await loadActivities();
        await loadList();
      } catch (e) {}
    })();

    /* ========== 活动横幅 ========== */
    async function loadActivities() {
      try {
        const res = await fetchJSON("/api/activities?size=10");
        activities = res.data;
        if (activities.length > 0) {
          renderActivity();
          if (activities.length > 1) {
            actTimer = setInterval(() => {
              actIdx = (actIdx + 1) % activities.length;
              renderActivity();
            }, 6000);
          }
        }
      } catch (e) {}
    }

    function renderActivity() {
      const area = document.getElementById("activityArea");
      if (activities.length === 0) { area.innerHTML = ""; return; }
      const a = activities[actIdx];
      const typeName = a.activity_type === 2 ? "活动" : "通知";
      const scopeFull = a.scope === 1 ? "全体用户" : `粉丝团「${a.club_name || '指定'}」成员`;

      area.innerHTML = `
        <div class="activity-bar">
          <div class="act-title">
            <span class="act-tag type-${a.activity_type}">${typeName}</span>
            ${a.title}
          </div>
          <div class="act-content">${a.content}</div>
          <div class="act-meta">
            <span>📌 仅对 ${scopeFull} 可见</span>
            <span>👤 由 ${a.poster_name} 发布</span>
            <span>⏰ ${fmt(a.create_time)}</span>
          </div>
          ${activities.length > 1 ? `
            <div class="act-pager">
              <button onclick="prevAct()" aria-label="上一个">◀</button>
              <span class="indicator">${actIdx + 1}/${activities.length}</span>
              <button onclick="nextAct()" aria-label="下一个">▶</button>
            </div>` : ""}
        </div>
      `;
    }
    function prevAct() { clearInterval(actTimer); actIdx = (actIdx - 1 + activities.length) % activities.length; renderActivity(); actTimer = setInterval(() => { actIdx = (actIdx + 1) % activities.length; renderActivity(); }, 6000); }
    function nextAct() { clearInterval(actTimer); actIdx = (actIdx + 1) % activities.length; renderActivity(); actTimer = setInterval(() => { actIdx = (actIdx + 1) % activities.length; renderActivity(); }, 6000); }

    /* ========== 明星列表 ========== */
    async function loadList() {
      const kw = document.getElementById("keyword").value.trim();
      const url = kw ? `/api/celebrities?keyword=${encodeURIComponent(kw)}` : "/api/celebrities";
      try {
        const res = await fetchJSON(url);
        const list = res.data;
        const area = document.getElementById("listArea");
        area.innerHTML = "";

        if (list.length === 0) {
          area.innerHTML = `<p style="text-align:center;color:var(--text-muted);padding:40px">还没有找到明星~</p>`;
          return;
        }

        const gradients = [
          "linear-gradient(135deg, #1a237e, #4a148c, #ff4d8a)",
          "linear-gradient(135deg, #0d47a1, #00acc1, #00e5ff)",
          "linear-gradient(135deg, #4a148c, #ad1457, #ffd700)",
          "linear-gradient(135deg, #1b5e20, #00695c, #00bcd4)",
          "linear-gradient(135deg, #b71c1c, #e65100, #ffab40)",
          "linear-gradient(135deg, #263238, #37474f, #78909c)",
        ];
        const emojis = ["🎤", "🎭", "🎮", "🎬", "🎨", "🎧", "🌟", "✨", "💫", "🎪"];

        list.forEach((c, i) => {
          const card = document.createElement("div");
          card.className = "celebrity-card";
          card.dataset.id = c.id;

          const cover = document.createElement("div");
          cover.className = "cover";
          cover.style.background = gradients[i % gradients.length];
          cover.textContent = emojis[i % emojis.length];

          const info = document.createElement("div");
          info.className = "info";

          const nameDiv = document.createElement("div");
          nameDiv.className = "name";
          nameDiv.textContent = c.stage_name;

          const catDiv = document.createElement("div");
          catDiv.className = "category";
          catDiv.textContent = c.category;

          const fansDiv = document.createElement("div");
          fansDiv.className = "fans";
          fansDiv.textContent = `👥 ${c.fan_count || 0} 粉丝`;

          info.appendChild(nameDiv);
          info.appendChild(catDiv);
          info.appendChild(fansDiv);
          card.appendChild(cover);
          card.appendChild(info);
          area.appendChild(card);

          card.addEventListener("click", () => {
            window.location.href = `/stardock/celebrity.html?id=${c.id}`;
          });
        });
      } catch (e) {}
    }

    // 回车搜索
    document.getElementById("keyword").addEventListener("keydown", e => {
      if (e.key === "Enter") loadList();
    });
  </script>
</body>
</html>
