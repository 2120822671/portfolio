<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星坞 StarDock —— 首页</title>
  <link rel="stylesheet" href="/stardock/css/style.css">
  <style>
    /* 活动横幅 */
    .activity-bar {
      background: linear-gradient(90deg, rgba(255,143,0,0.3), rgba(255,215,0,0.2));
      border: 1px solid rgba(255,215,0,0.5);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .activity-bar::before {
      content: "📢";
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%); font-size: 24px;
    }
    .activity-bar .act-title {
      font-weight: bold; color: #ffd700; font-size: 16px;
      margin-left: 36px; display: flex; align-items: center; gap: 10px;
    }
    .activity-bar .act-content {
      color: rgba(255,255,255,0.85); font-size: 13px;
      margin-left: 36px; margin-top: 6px; white-space: pre-wrap; line-height: 1.5;
    }
    .activity-bar .act-meta {
      margin-left: 36px; margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.5);
      display: flex; gap: 16px;
    }
    .act-tag {
      padding: 2px 8px; border-radius: 8px; font-size: 11px;
      background: rgba(255,215,0,0.2); color: #ffd700;
    }
    .act-tag.type-2 { background: rgba(255,87,34,0.25); color: #ff9800; }
    .act-pager {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      display: flex; gap: 6px;
    }
    .act-pager button {
      width: 26px; height: 26px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.15); color: #fff; cursor: pointer; font-size: 12px;
    }
    .act-pager button.active { background: #ffd700; color: #1a237e; }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <!-- 活动横幅区域 -->
    <div id="activityArea"></div>

    <h2 style="margin-bottom:16px">🌟 明星 / 主播 列表</h2>

    <div style="margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap">
      <input type="text" id="keyword" placeholder="搜索明星..." style="flex:1;padding:10px;border-radius:6px;border:none;background:rgba(255,255,255,0.1);color:#fff">
      <button class="btn" onclick="loadList()">搜索</button>
    </div>

    <div id="listArea" class="celebrity-grid"></div>
  </div>

  <script src="/stardock/js/common.js"></script>
  <script>
    let user = null;
    let activities = [];
    let actIdx = 0;
    let actTimer = null;

    (async () => {
      try {
        user = await requireRole();
        await loadNavbar();
        await loadActivities();
        await loadList();
      } catch (e) {}
    })();

    /* ========== 活动横幅（自动轮播，通知和活动都展示）========== */
    async function loadActivities() {
      try {
        const res = await fetchJSON("/api/activities?size=10");
        activities = res.data; // 通知 + 活动一起轮播
        if (activities.length > 0) {
          renderActivity();
          if (activities.length > 1) {
            actTimer = setInterval(() => {
              actIdx = (actIdx + 1) % activities.length;
              renderActivity();
            }, 6000);
          }
        }
      } catch (e) {}
    }

    function renderActivity() {
      const area = document.getElementById("activityArea");
      if (activities.length === 0) { area.innerHTML = ""; return; }
      const a = activities[actIdx];
      const typeName = a.activity_type === 2 ? "活动" : "通知";
      const scopeName = a.scope === 1 ? "全体" : (a.club_name || "指定粉丝团");
      const scopeFull = a.scope === 1 ? "全体用户" : `粉丝团「${a.club_name}」成员`;

      area.innerHTML = `
        <div class="activity-bar">
          <div class="act-title">
            <span class="act-tag type-${a.activity_type}">${typeName}</span>
            <span>${a.title}</span>
          </div>
          <div class="act-content">${a.content}</div>
          <div class="act-meta">
            <span>📌 仅对 ${scopeFull} 可见</span>
            <span>👤 由 ${a.poster_name} 发布</span>
            <span>⏰ ${fmt(a.create_time)}</span>
          </div>
          ${activities.length > 1 ? `
            <div class="act-pager">
              <button onclick="prevAct()">◀</button>
              <button class="active">${actIdx + 1}/${activities.length}</button>
              <button onclick="nextAct()">▶</button>
            </div>` : ""}
        </div>
      `;
    }
    function prevAct() { clearInterval(actTimer); actIdx = (actIdx - 1 + activities.length) % activities.length; renderActivity(); actTimer = setInterval(() => { actIdx = (actIdx + 1) % activities.length; renderActivity(); }, 6000); }
    function nextAct() { clearInterval(actTimer); actIdx = (actIdx + 1) % activities.length; renderActivity(); actTimer = setInterval(() => { actIdx = (actIdx + 1) % activities.length; renderActivity(); }, 6000); }

    /* ========== 明星列表 ========== */
    async function loadList() {
      const kw = document.getElementById("keyword").value.trim();
      const url = kw ? `/api/celebrities?keyword=${encodeURIComponent(kw)}` : "/api/celebrities";
      try {
        const res = await fetchJSON(url);
        const list = res.data;
        const html = list.map(c => `
          <div class="celebrity-card" data-id="${c.id}">
            <div class="cover">🎤</div>
            <div class="info">
              <div class="name">${c.stage_name}</div>
              <div class="category">${c.category}</div>
              <div class="fans">👥 ${c.fan_count || 0} 粉丝</div>
            </div>
          </div>
        `).join("");

        document.getElementById("listArea").innerHTML = html;
        document.querySelectorAll(".celebrity-card").forEach(el => {
          el.addEventListener("click", () => {
            window.location.href = `/stardock/celebrity.html?id=${el.dataset.id}`;
          });
        });
      } catch (e) {}
    }
  </script>
</body>
</html>
