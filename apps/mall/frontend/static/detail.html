<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蛋糕详情</title>
  <script src="/static/js/api.js"></script>
</head>
<body>
  <div id="nav-wrap"></div>
  <div class="container" id="app">加载中...</div>
  <script>
    injectCommonCss(); renderNav();

    const id = new URLSearchParams(location.search).get("id");
    if (!id) location.href = "/static/index.html";

    async function render() {
      const { data } = await api(`/api/cake/${id}`);
      const c = data.cake;
      const favBtnText = data.faved ? "❤️ 已收藏" : "🤍 收藏";
      const specList = c.spec ? c.spec.split("/").map(s => s.trim()).filter(Boolean) : [];

      document.getElementById("app").innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)">
          <img src="${c.image}" style="width:100%;border-radius:8px;background:#f4f4f4">
          <div>
            <h1 style="margin:0 0 12px;font-size:24px">${c.cake_name}</h1>
            <div class="price" style="font-size:28px;margin-bottom:8px">¥${c.price}</div>
            <div class="muted">分类：${await catName(c.category_id)} · 库存：${c.stock}</div>
            <div style="margin:16px 0">${c.description || "暂无描述"}</div>
            ${specList.length ? `<div><strong>可选规格：</strong>${specList.map(s=>`<span class="tag">${s}</span>`).join("")}</div>` : ""}
            <div style="margin:16px 0;display:flex;align-items:center;gap:12px">
              <span>数量：</span>
              <div class="stepper">
                <button id="minus">−</button><span id="num">1</span><button id="plus">+</button>
              </div>
              <button class="btn-sm" id="btnFav">${favBtnText}</button>
            </div>
            <div style="display:flex;gap:12px">
              <button class="btn-primary" id="btnCart" style="padding:10px 20px">加入购物车</button>
              <button class="btn-ghost" id="btnBuyNow" style="padding:10px 20px">立即购买</button>
            </div>
          </div>
        </div>
        <div class="section-title">💬 商品评价 (${data.comments.length})</div>
        <div id="commentBox"></div>
        <div class="card" style="margin-top:16px">
          <h4 style="margin:0 0 8px">写评价</h4>
          <textarea id="commentInput" placeholder="说点什么吧..."></textarea>
          <button class="btn-primary" id="btnComment">提交评价</button>
        </div>
      `;

      let num = 1;
      const numEl = document.getElementById("num");
      $("#plus").onclick = () => { if (num < c.stock) { num++; numEl.textContent = num; } };
      $("#minus").onclick = () => { if (num > 1) { num--; numEl.textContent = num; } };

      $("#btnCart").onclick = async () => {
        try {
          await api("/api/cart/add", { method: "POST", body: { cake_id: c.id, buy_num: num } });
          toast("已加入购物车", "success");
        } catch (e) { toast(e.message, "error"); }
      };
      $("#btnBuyNow").onclick = async () => {
        try {
          await api("/api/cart/add", { method: "POST", body: { cake_id: c.id, buy_num: num } });
          location.href = "/static/cart.html";
        } catch (e) { toast(e.message, "error"); }
      };
      $("#btnFav").onclick = async () => {
        try {
          const r = await api("/api/favorite/toggle", { method: "POST", body: { cake_id: c.id } });
          toast(r.action === "added" ? "已收藏" : "已取消收藏", "success");
          render();
        } catch (e) { toast(e.message, "error"); }
      };

      renderComments(data.comments);
      $("#btnComment").onclick = async () => {
        const txt = $("#commentInput").value.trim();
        if (!txt) return toast("评论内容不能为空", "error");
        try {
          await api("/api/comment/add", { method: "POST", body: { cake_id: c.id, content: txt } });
          toast("评价成功", "success");
          $("#commentInput").value = "";
          render();
        } catch (e) { toast(e.message, "error"); }
      };
    }

    function renderComments(list) {
      const box = $("#commentBox"); box.innerHTML = "";
      if (!list.length) { box.innerHTML = `<div class="empty">暂无评价</div>`; return; }
      list.forEach(x => {
        const d = document.createElement("div");
        d.className = "card";
        d.innerHTML = `<div class="row"><strong>${x.nickname || '匿名'}</strong><span class="muted">${x.create_time}</span></div>
                       <div style="margin-top:8px">${x.content}</div>`;
        box.appendChild(d);
      });
    }

    async function catName(cid) {
      const cats = (await api("/api/category/list")).data;
      return cats.find(c => c.id === cid)?.category_name || "";
    }

    render();
  </script>
</body>
</html>
