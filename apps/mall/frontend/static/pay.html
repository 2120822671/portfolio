<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>支付</title>
  <script src="/static/js/api.js"></script>
</head>
<body>
  <div id="nav-wrap"></div>
  <div class="container" style="max-width:500px">
    <div class="card" style="text-align:center;padding:40px">
      <div style="font-size:48px">💳</div>
      <div class="section-title">模拟支付</div>
      <div>订单号：<b id="orderNo"></b></div>
      <div style="font-size:28px;color:#ff4757;margin:16px 0">¥<span id="amount"></span></div>
      <button class="btn-primary btn-block" id="btnPay">立即支付</button>
      <div class="row" style="justify-content:center;gap:12px;margin-top:12px">
        <button class="btn-ghost" id="btnCancel">取消订单</button>
      </div>
    </div>
  </div>
  <script>
    injectCommonCss(); renderNav();
    const orderNo = new URLSearchParams(location.search).get("order_no");
    document.getElementById("orderNo").textContent = orderNo;

    // 查一下订单金额
    (async () => {
      const { data } = await api("/api/order/list?page=1&page_size=50");
      const o = data.find(x => x.order_no === orderNo);
      if (!o) { toast("订单不存在", "error"); return; }
      document.getElementById("amount").textContent = o.total_amount;
    })();

    $("#btnPay").onclick = async () => {
      try {
        await api("/api/order/pay", { method: "POST", body: { order_no: orderNo } });
        toast("支付成功！", "success");
        location.href = "/static/order.html";
      } catch (e) { toast(e.message, "error"); }
    };
    $("#btnCancel").onclick = async () => {
      if (!await confirm2("确定取消订单？")) return;
      try {
        await api("/api/order/cancel", { method: "POST", body: { order_no: orderNo } });
        toast("已取消，库存已回补", "success");
        location.href = "/static/order.html";
      } catch (e) { toast(e.message, "error"); }
    };
  </script>
</body>
</html>
