<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>购物车</title>
  <script src="/static/js/api.js"></script>
</head>
<body>
  <div id="nav-wrap"></div>
  <div class="container">
    <div class="section-title">🛒 购物车</div>
    <div id="list"></div>
    <div id="checkoutBar" class="card" style="position:sticky;bottom:0;margin-top:16px;display:none">
      <div class="row">
        <span>已选 <b id="selCount">0</b> 件商品</span>
        <span>合计：<span class="price" style="font-size:20px">¥<span id="selTotal">0.00</span></span></span>
        <button class="btn-primary" id="btnCheckout" style="padding:10px 20px">去结算</button>
      </div>
    </div>
  </div>
  <script>
    injectCommonCss(); renderNav();

    let cart = [];
    async function load() {
      cart = (await api("/api/cart/list")).data;
      const host = $("#list"); host.innerHTML = "";
      if (!cart.length) { host.innerHTML = `<div class="empty">购物车空空如也~<br><a class="btn-primary" href="/static/index.html" style="display:inline-block;margin-top:16px">去逛逛</a></div>`; hideBar(); return; }
      cart.forEach(c => {
        const row = document.createElement("div");
        row.className = "card cart-card";
        row.innerHTML = `
          <input type="checkbox" class="chk" data-id="${c.cart_id}" ${c.on_shelf ? "checked" : ""} ${!c.on_shelf ? "disabled" : ""}>
          <a href="/static/detail.html?id=${c.id}"><img src="${c.image}"></a>
          <div class="cart-info">
            <div class="title"><a href="/static/detail.html?id=${c.id}">${c.cake_name}</a>${!c.on_shelf ? '<span class="tag" style="margin-left:6px">已下架</span>' : ''}</div>
            <div class="sub">¥${c.price} / 件　库存 ${c.stock}</div>
          </div>
          <div class="cart-right">
            <div class="price">¥${(c.price * c.buy_num).toFixed(2)}</div>
            <div class="stepper" data-id="${c.cart_id}">
              <button data-act="minus">−</button><span>${c.buy_num}</span><button data-act="plus">+</button>
            </div>
            <button class="btn-ghost btnDel" data-id="${c.cart_id}">删除</button>
          </div>`;
        host.appendChild(row);
      });
      host.querySelectorAll(".stepper button").forEach(b => b.onclick = async () => {
        const cart_id = parseInt(b.parentElement.dataset.id);
        const step = cart.find(x => x.cart_id === cart_id);
        if (b.dataset.act === "plus") step.buy_num++;
        else if (step.buy_num > 1) step.buy_num--;
        await api("/api/cart/update", { method: "POST", body: { cart_id, buy_num: step.buy_num } });
        load();
      });
      host.querySelectorAll(".btnDel").forEach(b => b.onclick = async () => {
        if (await confirm2("确定删除？")) {
          await api("/api/cart/delete", { method: "POST", body: { cart_id: parseInt(b.dataset.id) } });
          toast("已删除", "success"); load();
        }
      });
      host.querySelectorAll(".chk").forEach(c => c.onchange = updateBar);
      updateBar();
    }
    function hideBar() { $("#checkoutBar").style.display = "none"; }
    function updateBar() {
      const sel = cart.filter((c, i) => document.querySelectorAll(".chk")[i]?.checked);
      const total = sel.reduce((s, c) => s + c.price * c.buy_num, 0);
      if (sel.length) {
        $("#checkoutBar").style.display = "block";
        $("#selCount").textContent = sel.reduce((s,c)=>s+c.buy_num,0);
        $("#selTotal").textContent = total.toFixed(2);
      } else hideBar();
    }
    $("#btnCheckout").onclick = async () => {
      const sel = cart.filter((c, i) => document.querySelectorAll(".chk")[i]?.checked).map(c => c.cart_id);
      if (!sel.length) return toast("请勾选商品", "error");
      location.href = "/static/checkout.html?ids=" + sel.join(",");
    };
    load();
  </script>
</body>
</html>
