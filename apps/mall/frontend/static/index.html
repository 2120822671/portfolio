<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>蛋糕商城 - 首页</title>
  <script src="/static/js/api.js"></script>
</head>
<body>
  <div id="nav-wrap"></div>
  <div class="container">
    <div class="section-title">🍰 蛋糕商城 · 精选款式</div>
    <div class="filter-bar">
      <select id="catSel"><option value="">全部分类</option></select>
      <select id="sortSel"><option value="">默认排序</option>
        <option value="price_asc">价格从低到高</option>
        <option value="price_desc">价格从高到低</option></select>
      <input id="kwInput" placeholder="搜索蛋糕名称..." style="max-width:240px;margin:0">
      <button class="btn-primary" id="btnSearch">搜索</button>
      <span style="flex:1"></span>
      <button class="btn-ghost" id="btnFav" style="display:none">⭐ 我的收藏</button>
    </div>
    <div id="cakeGrid" class="grid grid-cols-4"></div>
    <div id="pager" class="row" style="justify-content:center;gap:8px;margin-top:24px"></div>
  </div>

  <script>
    injectCommonCss();
    renderNav();

    const catSel = $("#catSel"), sortSel = $("#sortSel"), kwInput = $("#kwInput");
    let page = 1, pageSize = 8;

    async function loadCats() {
      const { data } = await api("/api/category/list");
      data.forEach(c => {
        const o = document.createElement("option"); o.value = c.id; o.textContent = c.category_name;
        catSel.appendChild(o);
      });
    }

    async function loadList() {
      const params = new URLSearchParams();
      if (catSel.value) params.set("category_id", catSel.value);
      if (sortSel.value) params.set("sort_by", sortSel.value);
      if (kwInput.value.trim()) params.set("keyword", kwInput.value.trim());
      params.set("page", page); params.set("page_size", pageSize);
      const { data } = await api("/api/cake/list?" + params);
      const grid = $("#cakeGrid"); grid.innerHTML = "";
      if (!data.list.length) { grid.innerHTML = `<div class="empty">暂时没有蛋糕~</div>`; $("#pager").innerHTML = ""; return; }
      data.list.forEach(c => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <a href="/static/detail.html?id=${c.id}"><img src="${c.image}" alt="${c.cake_name}"></a>
          <h3><a href="/static/detail.html?id=${c.id}">${c.cake_name}</a></h3>
          <div class="muted">${c.category_name || ''} · 库存 ${c.stock}</div>
          <div class="row" style="margin-top:8px"><span class="price">¥${c.price}</span></div>`;
        grid.appendChild(card);
      });
      renderPager(data.total, data.page, data.page_size);
    }

    function renderPager(total, cur, size) {
      const pager = $("#pager"); pager.innerHTML = "";
      const totalPages = Math.max(1, Math.ceil(total / size));
      if (cur > 1) pager.appendChild(btn("上一页", () => { page--; loadList(); }));
      for (let i = Math.max(1, cur - 2); i <= Math.min(totalPages, cur + 2); i++) {
        const b = btn(i, () => { page = i; loadList(); });
        if (i === cur) b.style.background = "#ff6b6b"; b.style.color = "#fff";
        pager.appendChild(b);
      }
      if (cur < totalPages) pager.appendChild(btn("下一页", () => { page++; loadList(); }));
    }
    function btn(txt, onClick) {
      const b = document.createElement("button");
      b.textContent = txt; b.className = "btn-ghost";
      b.onclick = onClick; return b;
    }

    catSel.addEventListener("change", () => { page = 1; loadList(); });
    sortSel.addEventListener("change", () => { page = 1; loadList(); });
    $("#btnSearch").addEventListener("click", () => { page = 1; loadList(); });
    kwInput.addEventListener("keydown", e => { if (e.key === "Enter") { page = 1; loadList(); } });

    loadCats().then(loadList);
  </script>
</body>
</html>
