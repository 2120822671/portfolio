<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>去结算</title>
  <script src="/static/js/api.js"></script>
</head>
<body>
  <div id="nav-wrap"></div>
  <div class="container" id="app">加载中...</div>
  <script>
    injectCommonCss(); renderNav();

    async function load() {
      const ids = new URLSearchParams(location.search).get("ids").split(",").map(Number);
      const cart = (await api("/api/cart/list")).data.filter(c => ids.includes(c.cart_id));
      const addrs = (await api("/api/address/list")).data;
      const defAddr = addrs.find(a => a.is_default) || addrs[0];

      const total = cart.reduce((s, c) => s + c.price * c.buy_num, 0);

      document.getElementById("app").innerHTML = `
        <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px">
          <div>
            <div class="section-title">📍 收货地址</div>
            ${addrs.length ? addrs.map(a => `
              <label class="card" style="display:block;margin-bottom:10px;cursor:pointer">
                <input type="radio" name="addr" value="${a.id}" ${defAddr?.id===a.id?"checked":""} style="width:auto">
                <strong>${a.receiver_name}</strong> <span class="muted">${a.receiver_phone}</span><br>
                <span>${a.address}</span>${a.is_default?' <span class="tag">默认</span>':''}
              </label>`).join("") : `<div class="empty">还没有收货地址，请先<a href="/static/address.html">去添加</a></div>`}
            <button class="btn-ghost" onclick="location.href='/static/address.html'" style="margin-top:6px">+ 添加新地址</button>

            <div class="section-title">📝 订单备注</div>
            <textarea id="remark" placeholder="写点什么告诉店家吧..."></textarea>
          </div>

          <div>
            <div class="section-title">🧾 商品清单</div>
            <div class="card">
              ${cart.map(c => `
                <div class="row" style="padding:6px 0"><span>${c.cake_name}</span><span>¥${c.price} × ${c.buy_num}</span></div>
              `).join("")}
              <hr style="border:none;border-top:1px dashed #eee;margin:12px 0">
              <div class="row"><span>合计</span><span class="price" style="font-size:20px">¥${total.toFixed(2)}</span></div>
              <button class="btn-primary btn-block" id="btnSubmit">提交订单</button>
            </div>
          </div>
        </div>
      `;

      $("#btnSubmit").onclick = async () => {
        const addrSel = document.querySelector('input[name="addr"]:checked');
        if (!addrSel) return toast("请选择收货地址", "error");
        try {
          const r = await api("/api/order/create", { method: "POST", body: {
            cart_ids: ids, address_id: parseInt(addrSel.value), remark: $("#remark").value
          }});
          toast("下单成功，请支付", "success");
          location.href = `/static/pay.html?order_no=${r.order_no}`;
        } catch (e) { toast(e.message, "error"); }
      };
    }
    load();
  </script>
</body>
</html>
