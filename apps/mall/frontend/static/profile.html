<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人中心</title>
  <script src="/static/js/api.js"></script>
</head>
<body>
  <div id="nav-wrap"></div>
  <div class="container" style="max-width:700px">
    <div class="section-title">👤 个人中心</div>
    <div id="me" class="card"></div>

    <div class="section-title">⭐ 我的收藏</div>
    <div id="fav" class="grid grid-cols-4"></div>
  </div>
  <script>
    injectCommonCss(); renderNav();

    async function load() {
      const me = (await api("/api/auth/me")).user;
      $("#me").innerHTML = `
        <div style="display:flex;gap:24px;align-items:center;margin-bottom:16px;padding-bottom:16px;border-bottom:1px dashed #eee">
          <div style="width:70px;height:70px;border-radius:50%;background:#ffecec;display:flex;align-items:center;justify-content:center;font-size:30px">${(me.nickname||me.username)[0].toUpperCase()}</div>
          <div>
            <div style="font-size:18px;font-weight:600">${me.nickname || me.username}</div>
            <div class="muted">@${me.username} · ${me.role===1?'管理员':'普通顾客'}</div>
          </div>
        </div>
        <div class="row"><span style="width:80px">用户名</span><span>${me.username} <span class="muted">（不可改）</span></span></div>
        <div class="row"><span style="width:80px">昵称</span><input id="nick" value="${me.nickname || me.username}" style="width:260px"></div>
        <div class="row"><span style="width:80px">手机号</span><input id="phone" value="${me.phone}" style="width:260px"></div>
        <div class="row"><span style="width:80px">注册时间</span><span class="muted">${me.create_time}</span></div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="btn-primary" id="btnSaveMe">保存资料</button>
          <button class="btn-ghost" id="btnChangePwd">修改密码</button>
        </div>
      `;
      $("#btnSaveMe").onclick = async () => {
        const nickname = $("#nick").value.trim();
        const phone = $("#phone").value.trim();
        if (!nickname) return toast("昵称不能为空", "error");
        if (phone && !/^\d{11}$/.test(phone)) return toast("手机号格式错误", "error");
        try {
          await api("/api/profile/update", { method: "POST", body: { nickname, phone } });
          toast("保存成功", "success");
        } catch (e) { toast(e.message, "error"); }
      };
      $("#btnChangePwd").onclick = openPasswordModal;

      const favs = (await api("/api/favorite/list")).data;
      const host = $("#fav"); host.innerHTML = "";
      if (!favs.length) { host.innerHTML = `<div class="empty">暂无收藏</div>`; return; }
      favs.forEach(f => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <a href="/static/detail.html?id=${f.id}"><img src="${f.image}"></a>
          <h3><a href="/static/detail.html?id=${f.id}">${f.cake_name}</a></h3>
          <div class="price">¥${f.price}</div>
          <button class="btn-sm" data-remove="${f.id}">取消收藏</button>`;
        host.appendChild(card);
      });
      host.querySelectorAll("[data-remove]").forEach(b => b.onclick = async () => {
        await api("/api/favorite/toggle", { method: "POST", body: { cake_id: parseInt(b.dataset.remove) } });
        toast("已取消收藏", "success"); load();
      });
    }

    function openPasswordModal() {
      let m = document.getElementById("__pwd_modal");
      if (m) m.remove();
      m = document.createElement("div"); m.id = "__pwd_modal";
      m.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9999";
      m.innerHTML = `
        <div class="modal-box" style="background:#fff;border-radius:12px;padding:20px;width:380px">
          <h3 style="margin-top:0">🔐 修改密码</h3>
          <input id="oldPwd" type="password" placeholder="原密码">
          <input id="newPwd" type="password" placeholder="新密码（至少 6 位）">
          <input id="confirmPwd" type="password" placeholder="再输一遍新密码">
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn-primary" id="pwdSave">确认修改</button>
            <button class="btn-ghost" id="pwdCancel">取消</button>
          </div>
        </div>`;
      document.body.appendChild(m);
      $("#pwdCancel").onclick = () => m.remove();
      m.onclick = (e) => { if (e.target === m) m.remove(); };
      $("#pwdSave").onclick = async () => {
        const old_pwd = $("#oldPwd").value, new_pwd = $("#newPwd").value, confirm_pwd = $("#confirmPwd").value;
        if (!old_pwd || !new_pwd || !confirm_pwd) return toast("请填完整", "error");
        if (new_pwd.length < 6) return toast("新密码至少 6 位", "error");
        if (new_pwd !== confirm_pwd) return toast("两次新密码不一致", "error");
        try {
          await api("/api/profile/password", { method: "POST", body: { old_password: old_pwd, new_password: new_pwd } });
          toast("密码已更新", "success"); m.remove();
        } catch (e) { toast(e.message, "error"); }
      };
    }
    load();
  </script>
</body>
</html>
