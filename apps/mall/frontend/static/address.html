<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>收货地址</title>
  <script src="/static/js/api.js"></script>
</head>
<body>
  <div id="nav-wrap"></div>
  <div class="container" style="max-width:700px">
    <div class="section-title">📍 收货地址 <button class="btn-primary" id="btnAdd" style="margin-left:auto;display:inline-block;padding:6px 14px">+ 新增地址</button></div>
    <div id="list"></div>

    <div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;align-items:center;justify-content:center">
      <div class="modal-box" style="background:#fff;border-radius:12px;padding:20px;width:400px">
        <h3 id="modalTitle">新增地址</h3>
        <input id="addr_receiver" placeholder="收货人姓名">
        <input id="addr_phone" placeholder="手机号">
        <input id="addr_address" placeholder="详细地址">
        <label><input type="checkbox" id="addr_default" style="width:auto"> 设为默认</label>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn-primary" id="btnSave">保存</button>
          <button class="btn-ghost" id="btnCancelModal">取消</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    injectCommonCss(); renderNav();
    let editingId = null;

    async function load() {
      const { data } = await api("/api/address/list");
      const host = $("#list"); host.innerHTML = "";
      if (!data.length) { host.innerHTML = `<div class="empty">暂无地址</div>`; return; }
      data.forEach(a => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="row">
            <div>
              <div style="display:flex;align-items:center;gap:8px">
                <strong style="font-size:16px">${a.receiver_name}</strong>
                <span class="muted">${a.receiver_phone}</span>
                ${a.is_default ? '<span class="tag" style="background:#fff4e6;color:#fa8c16">★ 默认地址</span>' : ''}
              </div>
              <div style="color:#666;margin-top:4px">📍 ${a.address}</div>
            </div>
            <div style="display:flex;gap:6px">
              ${a.is_default ? '<span class="muted" style="font-size:12px">当前默认</span>' : `<button class="btn-ghost" data-set="${a.id}">设为默认</button>`}
              <button class="btn-sm" data-e="${a.id}">编辑</button>
              <button class="btn-ghost" data-d="${a.id}">删除</button>
            </div>
          </div>`;
        host.appendChild(card);
      });
      host.querySelectorAll("[data-e]").forEach(b => b.onclick = () => openEdit(parseInt(b.dataset.e)));
      host.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
        if (await confirm2("删除该地址？")) {
          await api("/api/address/delete", { method: "POST", body: { id: parseInt(b.dataset.d) } });
          toast("已删除", "success"); load();
        }
      });
      host.querySelectorAll("[data-set]").forEach(b => b.onclick = async () => {
        await api("/api/address/update", { method: "POST", body: { id: parseInt(b.dataset.set), is_default: 1 } });
        toast("已设为默认", "success"); load();
      });
    }

    function openEdit(id) {
      editingId = id || null;
      $("#modalTitle").textContent = id ? "编辑地址" : "新增地址";
      if (id) {
        const a = (async () => {
          const { data } = await api("/api/address/list");
          const cur = data.find(x => x.id === id);
          $("#addr_receiver").value = cur.receiver_name;
          $("#addr_phone").value = cur.receiver_phone;
          $("#addr_address").value = cur.address;
          $("#addr_default").checked = !!cur.is_default;
        })();
      } else {
        $("#addr_receiver").value = $("#addr_phone").value = $("#addr_address").value = "";
        $("#addr_default").checked = false;
      }
      $("#editModal").style.display = "flex";
    }
    $("#btnCancelModal").onclick = () => $("#editModal").style.display = "none";
    $("#editModal").onclick = (e) => { if (e.target.id === "editModal") $("#editModal").style.display = "none"; };
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#editModal").style.display = "none"; });
    $("#btnAdd").onclick = () => openEdit(null);
    $("#btnSave").onclick = async () => {
      const receiver_name = $("#addr_receiver").value.trim();
      const receiver_phone = $("#addr_phone").value.trim();
      const address = $("#addr_address").value.trim();
      const is_default = $("#addr_default").checked ? 1 : 0;
      if (!receiver_name) return toast("收货人姓名不能为空", "error");
      if (receiver_name.length > 20) return toast("姓名太长（≤20 字）", "error");
      if (!/^\d{11}$/.test(receiver_phone)) return toast("手机号必须是 11 位数字", "error");
      if (address.length < 5) return toast("详细地址至少 5 个字", "error");
      if (address.length > 200) return toast("详细地址太长（≤200 字）", "error");
      try {
        if (editingId) {
          await api("/api/address/update", { method: "POST", body: { id: editingId, receiver_name, receiver_phone, address, is_default } });
        } else {
          await api("/api/address/add", { method: "POST", body: { receiver_name, receiver_phone, address, is_default } });
        }
        toast("保存成功", "success"); $("#editModal").style.display = "none"; load();
      } catch (e) { toast(e.message, "error"); }
    };

    load();
  </script>
</body>
</html>
