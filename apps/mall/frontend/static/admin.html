<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理后台 - 蛋糕商城</title>
  <script src="/static/js/api.js"></script>
</head>
<body>
  <div id="nav-wrap"></div>
  <div class="container" style="max-width:1280px">
    <div class="stats-grid" id="stats"></div>

    <div class="filter-bar">
      <button class="btn-primary" data-tab="cakes">蛋糕商品</button>
      <button class="btn-ghost" data-tab="cats">分类</button>
      <button class="btn-ghost" data-tab="orders">订单</button>
      <button class="btn-ghost" data-tab="users">用户</button>
      <button class="btn-ghost" data-tab="comments">评价</button>
    </div>

    <div id="panel"></div>
  </div>
  <script>
    injectCommonCss(); renderNav();
    let tab = "cakes";

    async function checkAdmin() {
      const me = await getMe();
      if (!me || me.role !== 1) {
        document.getElementById("panel").innerHTML = `<div class="empty">请以管理员身份登录（admin / 123456）<br><a class="btn-primary" href="/static/index.html">返回首页</a></div>`;
        return false;
      }
      return true;
    }

    async function loadStats() {
      const { data } = await api("/api/admin/stats");
      $("#stats").innerHTML = `
        <div class="stat-card"><div class="label">注册用户</div><div class="value">${data.users}</div></div>
        <div class="stat-card"><div class="label">上架蛋糕</div><div class="value">${data.cakes}</div></div>
        <div class="stat-card"><div class="label">总订单数</div><div class="value">${data.orders}</div></div>
        <div class="stat-card"><div class="label">完成营业额</div><div class="value">¥${data.amount.toFixed(2)}</div></div>`;
    }

    // ============ 蛋糕 ============
    async function panelCakes() {
      const cats = (await api("/api/category/list")).data;
      const { data } = await api("/api/admin/cake/list?page=1&page_size=50");
      const catMap = Object.fromEntries(cats.map(c => [c.id, c.category_name]));
      $("#panel").innerHTML = `
        <div class="row" style="margin-bottom:12px">
          <input id="cakeKw" placeholder="按名称搜索" style="max-width:240px;margin:0">
          <select id="cakeCat" style="max-width:160px;margin:0"><option value="">全部分类</option>${cats.map(c=>`<option value="${c.id}">${c.category_name}</option>`).join("")}</select>
          <button class="btn-primary" id="btnAddCake">+ 新增蛋糕</button>
        </div>
        <table class="table"><thead><tr>
          <th>ID</th><th>名称</th><th>分类</th><th>价格</th><th>库存</th><th>规格</th><th>状态</th><th>操作</th>
        </tr></thead><tbody>
          ${data.list.map(c=>`
            <tr>
              <td>${c.id}</td><td>${c.cake_name}</td><td>${catMap[c.category_id]||''}</td>
              <td>¥${c.price}</td><td>${c.stock}</td><td>${c.spec||''}</td>
              <td>${c.on_shelf?'<span class="tag">上架</span>':'<span class="tag" style="background:#f0f0f0;color:#999">下架</span>'}</td>
              <td><button class="btn-sm" data-e="${c.id}">编辑</button>
                  <button class="btn-ghost" data-d="${c.id}">下架</button></td>
            </tr>`).join("")}
        </tbody></table>
      `;
      $("#btnAddCake").onclick = () => editCake();
      $$("[data-e]").forEach(b => b.onclick = () => editCake(parseInt(b.dataset.e)));
      $$("[data-d]").forEach(b => b.onclick = async () => {
        if (await confirm2("确认下架？")) {
          await api("/api/admin/cake/delete", { method: "POST", body: { id: parseInt(b.dataset.d) } });
          toast("已下架", "success"); panelCakes();
        }
      });

      $("#cakeKw").oninput = debounce;
      $("#cakeCat").onchange = debounce;
      async function debounce() {
        const params = new URLSearchParams({ page: 1, page_size: 50 });
        if ($("#cakeKw").value.trim()) params.set("keyword", $("#cakeKw").value.trim());
        if ($("#cakeCat").value) params.set("category_id", $("#cakeCat").value);
        const { data } = await api("/api/admin/cake/list?" + params);
        // 简化：直接重渲
        $("#panel tbody").innerHTML = data.list.map(c=>`
          <tr><td>${c.id}</td><td>${c.cake_name}</td><td>${catMap[c.category_id]||''}</td>
          <td>¥${c.price}</td><td>${c.stock}</td><td>${c.spec||''}</td>
          <td>${c.on_shelf?'<span class="tag">上架</span>':'<span class="tag" style="background:#f0f0f0;color:#999">下架</span>'}</td>
          <td><button class="btn-sm" data-e="${c.id}">编辑</button>
              <button class="btn-ghost" data-d="${c.id}">下架</button></td></tr>`).join("");
      }
    }

    async function editCake(id) {
      const cats = (await api("/api/category/list")).data;
      let c = { category_id: cats[0]?.id, on_shelf: 1, price: 0, stock: 0 };
      if (id) {
        const { data } = await api(`/api/cake/${id}`);
        c = data.cake;
      }
      // 简易弹窗
      let m = document.getElementById("__cake_modal");
      if (m) m.remove();
      m = document.createElement("div"); m.id = "__cake_modal";
      m.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9999;";
      m.innerHTML = `
        <div class="modal-box" style="background:#fff;border-radius:12px;padding:20px;width:480px">
          <h3>${id?'编辑蛋糕':'新增蛋糕'}</h3>
          <input id="m_name" placeholder="名称" value="${c.cake_name||''}">
          <select id="m_cat">${cats.map(x=>`<option value="${x.id}" ${x.id===c.category_id?'selected':''}>${x.category_name}</option>`).join("")}</select>
          <input id="m_price" type="number" step="0.01" placeholder="价格" value="${c.price||''}">
          <input id="m_stock" type="number" placeholder="库存" value="${c.stock||''}">
          <input id="m_spec" placeholder="规格（/ 分隔）" value="${c.spec||''}">
          <input id="m_img" placeholder="图片 URL（可留空，系统自动生成）" value="${c.image||''}">
          <textarea id="m_desc" placeholder="描述">${c.description||''}</textarea>
          <label><input id="m_on" type="checkbox" ${c.on_shelf?'checked':''} style="width:auto"> 上架</label>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button class="btn-primary" id="m_save">保存</button>
            <button class="btn-ghost" id="m_cancel">取消</button>
          </div>
        </div>`;
      document.body.appendChild(m);
      $("#m_cancel", m).onclick = () => m.remove();
      $("#m_save", m).onclick = async () => {
        const body = {
          cake_name: $("#m_name", m).value.trim(),
          category_id: parseInt($("#m_cat", m).value),
          price: parseFloat($("#m_price", m).value),
          stock: parseInt($("#m_stock", m).value),
          spec: $("#m_spec", m).value.trim(),
          image: $("#m_img", m).value.trim(),
          description: $("#m_desc", m).value.trim(),
          on_shelf: $("#m_on", m).checked ? 1 : 0,
        };
        if (id) body.id = id;
        try {
          const url = id ? "/api/admin/cake/update" : "/api/admin/cake/add";
          await api(url, { method: "POST", body });
          toast("保存成功", "success"); m.remove(); panelCakes();
        } catch (e) { toast(e.message, "error"); }
      };
    }

    // ============ 分类 ============
    async function panelCats() {
      const { data } = await api("/api/category/list");
      $("#panel").innerHTML = `
        <div class="row" style="margin-bottom:12px">
          <input id="nc_name" placeholder="分类名" style="max-width:240px;margin:0">
          <input id="nc_sort" type="number" placeholder="排序号" value="0" style="max-width:120px;margin:0">
          <button class="btn-primary" id="btnAddCat">+ 新增</button>
        </div>
        <table class="table"><thead><tr><th>ID</th><th>名称</th><th>排序</th><th>操作</th></tr></thead><tbody>
          ${data.map(c=>`
            <tr><td>${c.id}</td><td><input value="${c.category_name}" style="width:140px" id="cn_${c.id}"></td>
                <td><input type="number" value="${c.sort}" style="width:80px" id="cs_${c.id}"></td>
                <td><button class="btn-sm" data-u="${c.id}">保存</button>
                    <button class="btn-ghost" data-d="${c.id}">删除</button></td></tr>`).join("")}
        </tbody></table>`;
      $("#btnAddCat").onclick = async () => {
        const name = $("#nc_name").value.trim();
        if (!name) return toast("名称不能为空", "error");
        await api("/api/admin/category/add", { method: "POST", body: { category_name: name, sort: parseInt($("#nc_sort").value) } });
        panelCats(); toast("已新增", "success");
      };
      $$("[data-u]").forEach(b => b.onclick = async () => {
        const id = parseInt(b.dataset.u);
        await api("/api/admin/category/update", { method: "POST", body: {
          id, category_name: $(`#cn_${id}`).value, sort: parseInt($(`#cs_${id}`).value) }});
        toast("已更新", "success"); panelCats();
      });
      $$("[data-d]").forEach(b => b.onclick = async () => {
        if (await confirm2("确认删除？")) {
          await api("/api/admin/category/delete", { method: "POST", body: { id: parseInt(b.dataset.d) } });
          panelCats(); toast("已删除", "success");
        }
      });
    }

    // ============ 订单 ============
    async function panelOrders() {
      const { data } = await api("/api/admin/order/list?page=1&page_size=50");
      $("#panel").innerHTML = `
        <table class="table"><thead><tr>
          <th>订单号</th><th>用户</th><th>金额</th><th>状态</th><th>收货</th><th>时间</th><th>明细</th><th>操作</th>
        </tr></thead><tbody>
          ${data.list.map(o=>`
            <tr>
              <td>${o.order_no}</td><td>${o.username}</td>
              <td>¥${o.total_amount}</td>
              <td><select data-s="${o.order_no}" style="width:110px;margin:0">
                <option value="0" ${o.order_status===0?'selected':''}>待支付</option>
                <option value="1" ${o.order_status===1?'selected':''}>待配送</option>
                <option value="2" ${o.order_status===2?'selected':''}>已完成</option>
                <option value="3" ${o.order_status===3?'selected':''}>已取消</option>
              </select></td>
              <td>${o.receiver_name} ${o.receiver_phone}<br><span class="muted">${o.receiver_address}</span></td>
              <td class="muted">${o.create_time}</td>
              <td>${o.items.map(i=>`${i.cake_name}×${i.buy_num}`).join("<br>")}</td>
              <td><button class="btn-sm" data-up="${o.order_no}">更新</button></td>
            </tr>`).join("")}
        </tbody></table>`;
      $$("[data-up]").forEach(b => b.onclick = async () => {
        const order_no = b.dataset.up;
        const st = parseInt($(`select[data-s="${order_no}"]`).value);
        await api("/api/admin/order/status", { method: "POST", body: { order_no, order_status: st } });
        toast("状态已更新", "success");
      });
    }

    // ============ 用户 ============
    async function panelUsers() {
      const { data } = await api("/api/admin/user/list?page=1&page_size=50");
      $("#panel").innerHTML = `
        <table class="table"><thead><tr>
          <th>ID</th><th>用户名</th><th>昵称</th><th>手机号</th><th>注册时间</th><th>角色</th><th>状态</th><th>操作</th>
        </tr></thead><tbody>
          ${data.list.map(u=>`
            <tr><td>${u.id}</td><td>${u.username}</td><td>${u.nickname||''}</td><td>${u.phone}</td>
                <td class="muted">${u.create_time}</td>
                <td>${u.role===1?'管理员':'普通用户'}</td>
                <td>${u.status?'<span class="tag" style="background:#e8f5e9;color:#4caf50">正常</span>':'<span class="tag">已冻结</span>'}</td>
                <td><button class="btn-sm" data-s="${u.id}" data-v="${u.status}">${u.status?'冻结':'解冻'}</button></td></tr>`).join("")}
        </tbody></table>`;
      $$("[data-s]").forEach(b => b.onclick = async () => {
        const id = parseInt(b.dataset.s);
        const next = parseInt(b.dataset.v) ? 0 : 1;
        if (!await confirm2(next ? "解冻该用户？" : "冻结该用户？")) return;
        await api("/api/admin/user/status", { method: "POST", body: { id, status: next } });
        toast("已更新", "success"); panelUsers();
      });
    }

    // ============ 评论 ============
    async function panelComments() {
      const { data } = await api("/api/admin/comment/list?page=1&page_size=50");
      $("#panel").innerHTML = `
        <table class="table"><thead><tr>
          <th>ID</th><th>用户</th><th>蛋糕</th><th>内容</th><th>时间</th><th>操作</th>
        </tr></thead><tbody>
          ${data.list.map(c=>`
            <tr><td>${c.id}</td><td>${c.nickname||''}</td><td>${c.cake_name||''}</td>
                <td style="max-width:300px">${c.content}</td>
                <td class="muted">${c.create_time}</td>
                <td><button class="btn-sm" data-d="${c.id}">删除</button></td></tr>`).join("")}
        </tbody></table>`;
      $$("[data-d]").forEach(b => b.onclick = async () => {
        if (await confirm2("删除该评论？")) {
          await api("/api/admin/comment/delete", { method: "POST", body: { id: parseInt(b.dataset.d) } });
          toast("已删除", "success"); panelComments();
        }
      });
    }

    $$(".filter-bar button").forEach(b => b.onclick = () => {
      $$(".filter-bar button").forEach(x => { x.classList.remove("btn-primary"); x.classList.add("btn-ghost"); });
      b.classList.add("btn-primary"); b.classList.remove("btn-ghost");
      tab = b.dataset.tab;
      loadTab();
    });

    const TAB_MAP = { cakes: panelCakes, cats: panelCats, orders: panelOrders, users: panelUsers, comments: panelComments };
    async function loadTab() { (await checkAdmin()) && TAB_MAP[tab](); }

    (async () => { await checkAdmin(); loadStats(); loadTab(); })();
  </script>
</body>
</html>
