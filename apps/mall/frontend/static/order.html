<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的订单</title>
  <script src="/static/js/api.js"></script>
</head>
<body>
  <div id="nav-wrap"></div>
  <div class="container">
    <div class="section-title">📦 我的订单</div>
    <div class="filter-bar">
      <button class="btn-ghost" data-s="">全部</button>
      <button class="btn-ghost" data-s="0">待支付</button>
      <button class="btn-ghost" data-s="1">待配送</button>
      <button class="btn-ghost" data-s="2">已完成</button>
      <button class="btn-ghost" data-s="3">已取消</button>
    </div>
    <div id="list"></div>
  </div>
  <script>
    injectCommonCss(); renderNav();
    const STATUS_TEXT = { 0: "待支付", 1: "待配送", 2: "已完成", 3: "已取消" };
    const STATUS_ORDER = [0, 1, 2];  // 正常流转
    let curStatus = null;

    async function load() {
      const url = curStatus === null ? "/api/order/list" : `/api/order/list?status=${curStatus}`;
      const { data } = await api(url);
      const me = (await api("/api/auth/me")).user;
      const myUid = me ? me.id : -1;
      // 查一下该用户写过的评论（判断评价过哪些蛋糕）
      let commentedCakes = new Set();
      try {
        const cakes = new Set(data.flatMap(o => o.items.map(i => i.cake_id)));
        for (const cid of cakes) {
          const { data: detail } = await api(`/api/cake/${cid}`);
          if (detail.comments.some(c => c.nickname === (me?.nickname || me?.username))) commentedCakes.add(cid);
        }
      } catch {}

      const host = $("#list"); host.innerHTML = "";
      if (!data.length) { host.innerHTML = `<div class="empty">暂无订单</div>`; return; }
      data.forEach((o, idx) => {
        const isExpanded = o.order_status === 2;  // 默认展开已完成订单
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="row" style="cursor:pointer" data-toggle="${idx}">
            <div style="display:flex;align-items:center;gap:8px">
              <b>订单号：${o.order_no}</b>
              <button class="btn-ghost" data-copy="${o.order_no}" style="padding:2px 8px;font-size:11px">复制</button>
              <span class="muted">${o.create_time}</span>
            </div>
            <span class="status-${o.order_status}">${STATUS_TEXT[o.order_status]} ▾</span>
          </div>

          <div id="detail-${idx}" style="${isExpanded ? '' : 'display:none'}">
            <div style="margin-top:10px">
              ${o.items.map(it => `
                <div class="row" style="padding:8px 0;border-bottom:1px dashed #eee">
                  <div style="display:flex;align-items:center;gap:10px">
                    <a href="/static/detail.html?id=${it.cake_id}">
                      <img src="" style="width:50px;height:50px;object-fit:cover;border-radius:4px;background:#f4f4f4" onerror="this.style.display='none'">
                    </a>
                    <div>
                      <div><a href="/static/detail.html?id=${it.cake_id}">${it.cake_name}</a></div>
                      <div class="muted">¥${it.buy_price} × ${it.buy_num}</div>
                    </div>
                  </div>
                  <div>小计：<span style="color:#ff4757;font-weight:600">¥${(it.buy_price * it.buy_num).toFixed(2)}</span></div>
                </div>`).join("")}
            </div>

            <div class="row" style="margin-top:10px">
              <div class="muted">
                📍 收货：<b>${o.receiver_name}</b> ${o.receiver_phone}<br>
                ${o.receiver_address}
                ${o.remark ? `<br>📝 备注：${o.remark}` : ""}
              </div>
              <div style="text-align:right">
                <div>商品总计：¥${o.total_amount}</div>
                <div class="price" style="font-size:18px">应付：¥${o.total_amount}</div>
              </div>
            </div>

            ${o.order_status === 2 && o.items.length ? `
              <div style="margin-top:14px;padding:12px;background:#fff8f0;border-radius:6px">
                <strong>✍️ 写评价</strong>
                ${o.items.map((it, i) => `
                  <div style="margin-top:8px">
                    <div class="muted">对 <b>${it.cake_name}</b> 的评价${commentedCakes.has(it.cake_id) ? ' <span class="tag" style="background:#e8f5e9;color:#4caf50">已评价</span>' : ''}</div>
                    <textarea id="cmt-${idx}-${i}" placeholder="说说蛋糕口感、配送体验..."></textarea>
                    <button class="btn-sm" data-cmt-order="${o.order_no}" data-cmt-cake="${it.cake_id}" data-cmt-idx="${idx}-${i}">提交评价</button>
                  </div>`).join("")}
              </div>` : ""}

            <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px">
              ${o.order_status===0?`<button class="btn-primary" onclick="goPay('${o.order_no}')">去支付</button><button class="btn-ghost" onclick="doCancel('${o.order_no}')">取消订单</button>`:""}
              ${o.order_status===1?`<button class="btn-primary" onclick="doConfirm('${o.order_no}')">确认收货</button><button class="btn-ghost" onclick="doCancel('${o.order_no}')">取消订单</button>`:""}
              ${o.order_status===2?`<a class="btn-sm" href="/static/detail.html?id=${o.items[0].cake_id}">再来一单</a>`:""}
              ${o.order_status===3?`<span class="muted">已取消，库存已回补</span>`:""}
            </div>
          </div>
        `;
        host.appendChild(card);
      });

      // 绑定展开
      host.querySelectorAll("[data-toggle]").forEach(el => el.onclick = () => {
        const id = el.dataset.toggle;
        const d = document.getElementById(`detail-${id}`);
        d.style.display = d.style.display === "none" ? "" : "none";
      });
      // 绑定复制
      host.querySelectorAll("[data-copy]").forEach(el => el.onclick = async () => {
        await navigator.clipboard.writeText(el.dataset.copy);
        toast("订单号已复制", "success");
      });
      // 绑定评价
      host.querySelectorAll("[data-cmt-cake]").forEach(btn => btn.onclick = async () => {
        const order_no = btn.dataset.cmtOrder;
        const cake_id = parseInt(btn.dataset.cmtCake);
        const inputId = "cmt-" + btn.dataset.cmtIdx;
        const content = document.getElementById(inputId).value.trim();
        if (!content) return toast("评论内容不能为空", "error");
        try {
          await api("/api/comment/add", { method: "POST", body: { order_no, cake_id, content } });
          toast("评价成功，感谢反馈！", "success");
          load();
        } catch (e) { toast(e.message, "error"); }
      });
    }

    async function goPay(order_no) { location.href = `/static/pay.html?order_no=${order_no}`; }
    async function doConfirm(order_no) {
      if (!await confirm2("确认已收到蛋糕？")) return;
      await api("/api/order/confirm", { method: "POST", body: { order_no } });
      toast("已确认收货", "success"); load();
    }
    async function doCancel(order_no) {
      if (!await confirm2("确定取消？取消后库存会自动回补")) return;
      await api("/api/order/cancel", { method: "POST", body: { order_no } });
      toast("已取消，库存已回补", "success"); load();
    }

    $$(".filter-bar button").forEach(b => b.onclick = () => {
      $$(".filter-bar button").forEach(x => x.classList.remove("btn-primary"));
      b.classList.add("btn-primary");
      curStatus = b.dataset.s === "" ? null : parseInt(b.dataset.s);
      load();
    });
    load();
  </script>
</body>
</html>
