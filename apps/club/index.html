<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生社团活动登记系统</title>
    <style>
        :root {
            --teal-900: #134E4A;
            --teal-800: #115E59;
            --teal-700: #0F766E;
            --teal-600: #0D9488;
            --teal-500: #14B8A6;
            --teal-100: #CCFBF1;
            --teal-50: #F0FDFA;
            --ink: #0F172A;
            --ink-soft: #334155;
            --muted: #64748B;
            --muted-light: #94A3B8;
            --line: #E2E8F0;
            --line-soft: #F1F5F9;
            --bg: #F4F7F9;
            --card: #FFFFFF;
            --danger: #B91C1C;
            --danger-bg: #FEF2F2;
            --danger-line: #FECACA;
            --radius-card: 18px;
            --radius-control: 10px;
            --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 18px 40px rgba(15, 23, 42, 0.06);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- 顶部栏 ---------- */
        .site-header {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--teal-900) 0%, var(--teal-700) 48%, var(--teal-500) 100%);
            color: #fff;
            border-radius: var(--radius-card);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 20px 44px rgba(15, 23, 42, 0.12);
        }

        .site-header::before,
        .site-header::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .site-header::before {
            width: 320px;
            height: 320px;
            right: -80px;
            top: -140px;
        }

        .site-header::after {
            width: 180px;
            height: 180px;
            right: 220px;
            bottom: -110px;
        }

        .header-inner {
            position: relative;
            z-index: 1;
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .brand-logo {
            flex: none;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .brand-text h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .brand-text p {
            margin: 6px 0 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.82);
        }

        .stats {
            display: flex;
            gap: 12px;
            flex: none;
        }

        .stat {
            min-width: 104px;
            padding: 12px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(6px);
        }

        .stat-label {
            display: block;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
        }

        .stat-value {
            display: block;
            margin-top: 2px;
            font-size: 20px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- 页面主体 ---------- */
        .page {
            max-width: 1080px;
            margin: 28px auto 48px;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: var(--radius-card);
            padding: 32px;
            box-shadow: var(--shadow-card);
        }

        .card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        .card-head h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .card-sub {
            margin: 6px 0 0;
            font-size: 13px;
            color: var(--muted);
        }

        .req-note {
            flex: none;
            font-size: 12px;
            color: var(--muted-light);
            padding-top: 4px;
        }

        .req { color: var(--teal-600); }

        /* ---------- 表单 ---------- */
        .form-grid {
            display: grid;
            grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.6fr) minmax(0, 1fr) auto;
            gap: 16px;
            align-items: end;
        }

        .field { min-width: 0; }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
        }

        .field input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius-control);
            background: #fff;
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 14px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .field input::placeholder { color: var(--muted-light); }

        .field input:hover { border-color: #CBD5E1; }

        .field input:focus {
            outline: none;
            border-color: var(--teal-500);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.14);
        }

        .input-wrap { position: relative; }

        .input-wrap input { padding-right: 38px; }

        .input-wrap .suffix {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: var(--muted-light);
            pointer-events: none;
        }

        .btn-primary {
            height: 46px;
            padding: 0 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: var(--radius-control);
            background: var(--teal-600);
            color: #fff;
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(13, 148, 136, 0.24);
            transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--teal-700);
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(13, 148, 136, 0.28);
        }

        .btn-primary:active:not(:disabled) { transform: translateY(0); }

        .btn-primary:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.24);
        }

        .btn-primary:disabled {
            cursor: not-allowed;
            opacity: 0.72;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-primary.is-loading .spinner { display: inline-block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- 消息条 ---------- */
        .msg {
            display: none;
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: var(--radius-control);
            font-size: 13px;
            border: 1px solid transparent;
            animation: slideDown 0.22s ease;
        }

        .msg.success {
            display: block;
            background: var(--teal-50);
            border-color: var(--teal-100);
            color: var(--teal-700);
        }

        .msg.error {
            display: block;
            background: var(--danger-bg);
            border-color: var(--danger-line);
            color: var(--danger);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- 列表 ---------- */
        .list-head { margin-bottom: 20px; }

        .list-tools {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: none;
        }

        .count-badge {
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--teal-50);
            border: 1px solid var(--teal-100);
            color: var(--teal-700);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .search-wrap {
            position: relative;
            width: 280px;
        }

        .search-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--muted-light);
            pointer-events: none;
        }

        .search-wrap input {
            width: 100%;
            height: 40px;
            padding: 0 14px 0 36px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 13px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .search-wrap input::placeholder { color: var(--muted-light); }

        .search-wrap input:focus {
            outline: none;
            border-color: var(--teal-500);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.14);
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 560px;
        }

        thead th {
            padding: 12px 16px;
            background: #F8FAFC;
            border-top: 1px solid var(--line-soft);
            border-bottom: 1px solid var(--line-soft);
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        thead th:first-child { border-radius: 10px 0 0 10px; border-left: 1px solid var(--line-soft); }
        thead th:last-child { border-radius: 0 10px 10px 0; border-right: 1px solid var(--line-soft); }

        tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--line-soft);
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr { transition: background 0.16s ease; }
        tbody tr:hover td { background: #FAFEFD; }

        .col-id { width: 76px; }
        .col-type { width: 140px; }
        .col-num { width: 120px; text-align: right !important; }

        td.col-id {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--muted-light);
        }

        td.col-num {
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        td.col-num .unit {
            margin-left: 2px;
            font-size: 12px;
            font-weight: 400;
            color: var(--muted-light);
        }

        .type-tag {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            background: var(--teal-50);
            border: 1px solid var(--teal-100);
            color: var(--teal-700);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        tbody tr.row-new td { animation: rowHighlight 1.4s ease; }

        @keyframes rowHighlight {
            0% { background: var(--teal-50); }
            100% { background: transparent; }
        }

        /* ---------- 空状态 ---------- */
        .empty {
            padding: 48px 16px;
            text-align: center;
        }

        .empty svg {
            width: 56px;
            height: 56px;
            stroke: #CBD5E1;
            margin-bottom: 12px;
        }

        .empty-title {
            margin: 0;
            font-size: 15px;
            color: var(--muted);
        }

        .empty-hint {
            margin: 6px 0 0;
            font-size: 13px;
            color: var(--muted-light);
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 920px) {
            .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .field-action { grid-column: 1 / -1; }
            .btn-primary { width: 100%; }
        }

        @media (max-width: 720px) {
            .header-inner {
                flex-direction: column;
                align-items: flex-start;
                padding: 24px 20px;
                gap: 16px;
            }
            .brand-logo { width: 40px; height: 40px; font-size: 18px; }
            .brand-text h1 { font-size: 20px; }
            .stats { width: 100%; }
            .stat { flex: 1; min-width: 0; padding: 10px 16px; }
            .page { margin: 16px auto 32px; padding: 0 16px; gap: 16px; }
            .card { padding: 20px; border-radius: 16px; }
            .site-header { border-radius: 16px; }
            .card-head { flex-direction: column; gap: 10px; }
            .req-note { padding-top: 0; }
            .form-grid { grid-template-columns: 1fr; }
            .list-tools { width: 100%; }
            .search-wrap { flex: 1; width: auto; }
            thead th, tbody td { padding: 12px; }
            .col-type { display: none; }
        }
    </style>
</head>
<body>
    <main class="page">
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <div class="brand-logo" aria-hidden="true">社</div>
                <div class="brand-text">
                    <h1>学生社团活动登记</h1>
                    <p>登记活动信息，随时掌握参与情况</p>
                </div>
            </div>
            <div class="stats" aria-label="活动统计">
                <div class="stat">
                    <span class="stat-label">活动总数</span>
                    <span class="stat-value" id="statCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">累计参与</span>
                    <span class="stat-value" id="statPeople">0</span>
                </div>
            </div>
        </div>
    </header>

    <section class="card" aria-labelledby="formTitle">
            <div class="card-head">
                <div>
                    <h2 id="formTitle">登记新活动</h2>
                    <p class="card-sub">填写活动信息后提交，记录会立即更新到下方列表</p>
                </div>
                <span class="req-note"><span class="req">*</span> 为必填项</span>
            </div>

            <div id="formMsg" class="msg" role="status" aria-live="polite"></div>

            <form id="activityForm" class="form-grid" novalidate>
                <div class="field">
                    <label for="activity_name">活动名称 <span class="req">*</span></label>
                    <input type="text" id="activity_name" name="activity_name" maxlength="100"
                           required autocomplete="off" placeholder="例如：春季篮球友谊赛">
                </div>
                <div class="field">
                    <label for="activity_type">活动类型 <span class="req">*</span></label>
                    <input type="text" id="activity_type" name="activity_type" maxlength="50"
                           list="activityTypes" required autocomplete="off"
                           placeholder="选择或输入活动类型">
                    <datalist id="activityTypes">
                        <option value="体育竞技"></option>
                        <option value="学术讲座"></option>
                        <option value="文艺汇演"></option>
                        <option value="志愿服务"></option>
                        <option value="社团招新"></option>
                        <option value="创新创业"></option>
                    </datalist>
                </div>
                <div class="field">
                    <label for="join_num">参与人数 <span class="req">*</span></label>
                    <div class="input-wrap">
                        <input type="number" id="join_num" name="join_num" min="1" max="9999" step="1"
                               required placeholder="1-9999">
                        <span class="suffix">人</span>
                    </div>
                </div>
                <div class="field field-action">
                    <button type="submit" id="submitBtn" class="btn-primary">
                        <span class="spinner" aria-hidden="true"></span>
                        <span class="btn-text">提交登记</span>
                    </button>
                </div>
            </form>
        </section>

        <section class="card" aria-labelledby="listTitle">
            <div class="card-head list-head">
                <div>
                    <h2 id="listTitle">活动记录</h2>
                    <p class="card-sub">按登记时间倒序排列</p>
                </div>
                <div class="list-tools">
                    <span class="count-badge" id="countBadge">共 0 条</span>
                    <div class="search-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="M20 20l-3.5-3.5" stroke-linecap="round"></path>
                        </svg>
                        <input type="search" id="searchInput" placeholder="搜索活动名称或类型"
                               aria-label="搜索活动名称或类型" autocomplete="off">
                    </div>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="col-id" scope="col">ID</th>
                            <th scope="col">活动名称</th>
                            <th class="col-type" scope="col">活动类型</th>
                            <th class="col-num" scope="col">参与人数</th>
                        </tr>
                    </thead>
                    <tbody id="activityList"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const state = {
            items: [],
            query: "",
            lastAddedId: null,
            msgTimer: null
        };

        const els = {
            form: document.getElementById("activityForm"),
            name: document.getElementById("activity_name"),
            type: document.getElementById("activity_type"),
            num: document.getElementById("join_num"),
            submitBtn: document.getElementById("submitBtn"),
            msg: document.getElementById("formMsg"),
            tbody: document.getElementById("activityList"),
            countBadge: document.getElementById("countBadge"),
            statCount: document.getElementById("statCount"),
            statPeople: document.getElementById("statPeople"),
            search: document.getElementById("searchInput")
        };

        const EMPTY_ICON = '<svg viewBox="0 0 64 64" fill="none" stroke-width="2" aria-hidden="true">' +
            '<rect x="14" y="10" width="36" height="44" rx="6"></rect>' +
            '<path d="M24 24h16M24 34h16M24 44h10" stroke-linecap="round"></path>' +
            '</svg>';

        function showMsg(text, type) {
            clearTimeout(state.msgTimer);
            els.msg.textContent = text;
            els.msg.className = "msg " + type;
            state.msgTimer = setTimeout(hideMsg, type === "success" ? 3000 : 5000);
        }

        function hideMsg() {
            clearTimeout(state.msgTimer);
            els.msg.className = "msg";
        }

        function setLoading(loading) {
            els.submitBtn.disabled = loading;
            els.submitBtn.classList.toggle("is-loading", loading);
            els.submitBtn.querySelector(".btn-text").textContent = loading ? "提交中…" : "提交登记";
        }

        function updateStats() {
            const total = state.items.length;
            const people = state.items.reduce(function (sum, item) {
                return sum + (Number(item.join_num) || 0);
            }, 0);
            els.statCount.textContent = total;
            els.statPeople.textContent = people;
        }

        function buildEmptyRow(title, hint) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 4;
            const box = document.createElement("div");
            box.className = "empty";
            box.innerHTML = EMPTY_ICON;
            const p1 = document.createElement("p");
            p1.className = "empty-title";
            p1.textContent = title;
            const p2 = document.createElement("p");
            p2.className = "empty-hint";
            p2.textContent = hint;
            box.appendChild(p1);
            box.appendChild(p2);
            td.appendChild(box);
            tr.appendChild(td);
            return tr;
        }

        function renderList() {
            const query = state.query.trim().toLowerCase();
            const items = query
                ? state.items.filter(function (item) {
                    return item.activity_name.toLowerCase().indexOf(query) !== -1 ||
                        item.activity_type.toLowerCase().indexOf(query) !== -1;
                })
                : state.items;

            els.tbody.innerHTML = "";
            els.countBadge.textContent = query ? "匹配 " + items.length + " 条" : "共 " + items.length + " 条";

            if (items.length === 0) {
                els.tbody.appendChild(
                    state.items.length === 0
                        ? buildEmptyRow("暂无活动记录", "在上方表单登记第一条活动吧")
                        : buildEmptyRow("没有匹配的活动", "试试更换关键词或清空搜索")
                );
                return;
            }

            items.forEach(function (item) {
                const tr = document.createElement("tr");
                if (item.id === state.lastAddedId) {
                    tr.className = "row-new";
                }

                const tdId = document.createElement("td");
                tdId.className = "col-id";
                tdId.textContent = item.id;

                const tdName = document.createElement("td");
                tdName.textContent = item.activity_name;

                const tdType = document.createElement("td");
                tdType.className = "col-type";
                const tag = document.createElement("span");
                tag.className = "type-tag";
                tag.textContent = item.activity_type;
                tdType.appendChild(tag);

                const tdNum = document.createElement("td");
                tdNum.className = "col-num";
                tdNum.textContent = item.join_num;
                const unit = document.createElement("span");
                unit.className = "unit";
                unit.textContent = "人";
                tdNum.appendChild(unit);

                tr.appendChild(tdId);
                tr.appendChild(tdName);
                tr.appendChild(tdType);
                tr.appendChild(tdNum);
                els.tbody.appendChild(tr);
            });

            state.lastAddedId = null;
        }

        async function loadActivities() {
            try {
                const response = await fetch("/api/activity/list");
                if (!response.ok) {
                    throw new Error("接口返回 " + response.status);
                }
                const data = await response.json();
                state.items = Array.isArray(data) ? data : [];
            } catch (error) {
                state.items = [];
                showMsg("列表加载失败：" + error.message, "error");
            }
            updateStats();
            renderList();
        }

        function extractError(data) {
            if (!data || !data.detail) {
                return "提交失败";
            }
            if (Array.isArray(data.detail)) {
                return data.detail.map(function (item) {
                    return item.msg;
                }).join("；");
            }
            return data.detail;
        }

        els.form.addEventListener("submit", async function (event) {
            event.preventDefault();
            hideMsg();

            const name = els.name.value.trim();
            const type = els.type.value.trim();
            const num = Number(els.num.value.trim());

            if (!name || !type) {
                showMsg("活动名称和活动类型不能为空或纯空格。", "error");
                return;
            }
            if (!Number.isInteger(num) || num < 1 || num > 9999) {
                showMsg("参与人数必须是 1-9999 的整数。", "error");
                return;
            }

            setLoading(true);
            try {
                const response = await fetch("/api/activity/add", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        activity_name: name,
                        activity_type: type,
                        join_num: num
                    })
                });

                let data = {};
                try {
                    data = await response.json();
                } catch (ignore) { }

                if (!response.ok) {
                    showMsg("错误：" + extractError(data), "error");
                    return;
                }

                els.form.reset();
                state.lastAddedId = data.id;
                showMsg("登记成功，活动已加入列表。", "success");
                await loadActivities();
            } catch (error) {
                showMsg("网络请求异常，请确认后端服务是否运行。", "error");
            } finally {
                setLoading(false);
            }
        });

        els.search.addEventListener("input", function () {
            state.query = els.search.value;
            renderList();
        });

        loadActivities();
    </script>
</body>
</html>
