<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 —— 星坞 StarDock</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .filter-row {
      display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .filter-row input, .filter-row select {
      flex: 1; min-width: 140px; padding: 10px 14px;
    }
    .filter-row .btn { padding: 10px 24px; }
    .card-table { padding: 0; overflow-x: auto; }
    th, td { padding: 12px 16px; white-space: nowrap; }
    td.role-1 { color: #81c784; }
    td.role-2 { color: #ef5350; }
    td.role-3 { color: #ffb74d; }
    td.status-1 { color: #69f0ae; }
    td.status-0 { color: #ff8a80; }
  </style>
</head>
<body>
<a href="https://37lixloirzejy43lagp.traesite.cn/" class="portal-back" style="position:fixed;left:14px;top:14px;z-index:99999;background:#b388ff;color:#1a1035;text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35)">← 返回作品集</a>
  <div id="navbar"></div>
  <div class="container">
    <h2>🛡️ 用 户 管 理</h2>

    <div class="filter-row">
      <input type="text" id="keyword" placeholder="🔍 搜索用户名 / 昵称">
      <select id="filterRole">
        <option value="">全部角色</option>
        <option value="1">粉丝</option>
        <option value="2">管理员</option>
        <option value="3">明星</option>
      </select>
      <button class="btn" onclick="loadList()">查询</button>
    </div>

    <div class="card card-table">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>账号</th><th>昵称</th><th>角色</th><th>积分</th><th>状态</th><th>注册时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script src="../js/demo-mock.js"></script>
  <script src="../js/common.js"></script>
  <script>
    const roleMap = { 1: "粉丝", 2: "管理员", 3: "明星" };
    const statusMap = { 0: "禁用", 1: "正常" };

    (async () => {
      try {
        await requireRole([2]);
        await loadNavbar();
        await loadList();
      } catch (e) {}
    })();

    async function loadList() {
      const kw = document.getElementById("keyword").value.trim();
      const role = document.getElementById("filterRole").value;
      const params = new URLSearchParams();
      if (kw) params.set("keyword", kw);
      if (role) params.set("role", role);

      try {
        const res = await fetchJSON("/api/users?" + params.toString());
        const list = res.data;
        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";

        list.forEach(u => {
          const tr = document.createElement("tr");
          tr.appendChild(_td(u.id));
          tr.appendChild(_td(u.username));
          tr.appendChild(_td(u.nickname));
          const roleTd = _td(roleMap[u.role] || "?");
          roleTd.className = `role-${u.role}`;
          tr.appendChild(roleTd);
          tr.appendChild(_td((u.score || 0).toLocaleString()));
          const statusTd = _td(statusMap[u.status]);
          statusTd.className = `status-${u.status}`;
          tr.appendChild(statusTd);
          tr.appendChild(_td(fmt(u.create_time)));

          const ops = document.createElement("td");
          const toggleBtn = document.createElement("button");
          toggleBtn.className = `btn btn-sm ${u.status === 1 ? "btn-danger" : ""}`;
          toggleBtn.textContent = u.status === 1 ? "禁用" : "启用";
          toggleBtn.onclick = () => toggleStatus(u.id, u.status);

          const roleBtn = document.createElement("button");
          roleBtn.className = "btn btn-sm btn-secondary";
          roleBtn.textContent = "切角色";
          roleBtn.onclick = () => toggleRole(u.id, u.role);

          ops.appendChild(toggleBtn);
          ops.appendChild(document.createTextNode(" "));
          ops.appendChild(roleBtn);
          tr.appendChild(ops);

          tbody.appendChild(tr);
        });

        if (list.length === 0) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.colSpan = 8;
          td.style.textAlign = "center";
          td.style.padding = "32px";
          td.style.color = "var(--text-muted)";
          td.textContent = "暂无数据";
          tr.appendChild(td);
          tbody.appendChild(tr);
        }
      } catch (e) {}
    }

    function _td(text) {
      const td = document.createElement("td");
      td.textContent = text;
      return td;
    }

    async function toggleStatus(id, current) {
      const newStatus = current === 1 ? 0 : 1;
      try {
        await fetchJSON(`/api/users/${id}/status`, {
          method: "PUT", body: { status: newStatus }
        });
        toast(`已${newStatus === 1 ? "启用" : "禁用"}`, "success");
        await loadList();
      } catch (e) {}
    }

    async function toggleRole(id, currentRole) {
      const roles = [1, 2, 3];
      const next = roles[(roles.indexOf(currentRole) + 1) % 3];
      if (!confirm(`确定要把用户升级为 ${roleMap[next]} 吗？`)) return;
      try {
        await fetchJSON(`/api/users/${id}/role`, {
          method: "PUT", body: { role: next }
        });
        toast("✅ 角色已更新", "success");
        await loadList();
      } catch (e) {}
    }
  </script>
</body>
</html>
