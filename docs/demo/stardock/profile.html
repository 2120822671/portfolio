<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 —— 星坞 StarDock</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-card {
      background: linear-gradient(135deg, rgba(5,10,42,0.8), rgba(13,21,71,0.7));
      border-radius: 20px;
      padding: 32px;
      border: 1px solid rgba(255,215,0,0.2);
      backdrop-filter: blur(12px);
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255,215,0,0.15);
    }
    .avatar-big {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--bg-deep-4), var(--star-gold-deep));
      border: 2px solid var(--star-gold);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }
    .profile-info h2 { margin: 0; background: none; -webkit-text-fill-color: unset; color: #fff; font-size: 22px; }
    .profile-info .sub { color: var(--star-gold); font-size: 13px; margin-top: 4px; }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .info-item {
      padding: 14px 18px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .info-item .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .info-item .val { font-size: 16px; font-weight: 600; color: var(--star-gold); }

    .edit-section {
      background: rgba(255,255,255,0.03);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .edit-section h3 { font-size: 16px; margin-bottom: 16px; }
    .edit-section .form-group { margin-bottom: 16px; }
    .edit-section .btn { padding: 12px 32px; }
  </style>
</head>
<body>
<a href="../../" class="portal-back" style="position:fixed;left:14px;top:14px;z-index:99999;background:#b388ff;color:#1a1035;text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35)">← 返回作品集</a>
  <div id="navbar"></div>
  <div class="container">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar-big">⭐</div>
        <div class="profile-info">
          <h2 id="nicknameDisplay">昵称加载中...</h2>
          <span class="sub" id="roleDisplay"></span>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <div class="lbl">账号</div>
          <div class="val" id="usernameDisplay">-</div>
        </div>
        <div class="info-item">
          <div class="lbl">当前积分</div>
          <div class="val" id="scoreDisplay" style="color:var(--star-gold)">💎 0</div>
        </div>
        <div class="info-item">
          <div class="lbl">收藏链接</div>
          <div class="val" style="font-size:13px">
            <a href="gacha.html">抽卡</a> · <a href="my-cards.html">图鉴</a> · <a href="recharge.html">充值</a>
          </div>
        </div>
      </div>

      <div class="edit-section">
        <h3>✏️ 修改昵称</h3>
        <div class="form-group">
          <label>新昵称</label>
          <input type="text" id="nickname" placeholder="新的昵称">
        </div>
        <button class="btn" onclick="saveProfile()">保 存 修 改</button>
      </div>
    </div>
  </div>

  <script src="js/demo-mock.js"></script>
  <script src="js/common.js"></script>
  <script>
    (async () => {
      try {
        const u = await requireRole();
        await loadNavbar();

        const roleMap = { 1: "粉丝 🌟", 2: "管理员 🛡️", 3: "明星 ⭐" };
        setText("nicknameDisplay", u.nickname);
        setText("roleDisplay", roleMap[u.role] || "未知");
        setText("usernameDisplay", u.username);
        document.getElementById("scoreDisplay").textContent = `💎 ${(u.score ?? 0).toLocaleString()}`;
        document.getElementById("nickname").value = u.nickname;
      } catch (e) {}
    })();

    async function saveProfile() {
      const nickname = document.getElementById("nickname").value.trim();
      if (!nickname) { toast("昵称不能为空", "warn"); return; }

      const btn = document.querySelector(".edit-section .btn");
      btnLoading(btn, true, "保存中...");

      try {
        await fetchJSON("/api/users/me", {
          method: "PUT",
          body: { nickname }
        });
        toast("✅ 保存成功！", "success");
        setText("nicknameDisplay", nickname);
        if (_currentUser) _currentUser.nickname = nickname;
        _saveUser(_currentUser);
        await loadNavbar("navbar", true);
      } catch (e) {} finally {
        btnLoading(btn, false, "保 存 修 改");
      }
    }
  </script>
</body>
</html>
