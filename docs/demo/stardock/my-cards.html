<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的图鉴 —— 星坞 StarDock</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label { color: var(--text-secondary); font-size: 13px; font-weight: 500; }
    .filter-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,215,0,0.25);
      background: rgba(255,255,255,0.05);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { border-color: var(--star-gold); color: var(--star-gold); }
    .filter-btn.active {
      background: linear-gradient(135deg, var(--star-gold), var(--star-gold-deep));
      color: var(--bg-deep-3);
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(255,215,0,0.3);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-item {
      text-align: center;
      padding: 14px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .stat-item .num { font-size: 20px; font-weight: 800; }
    .stat-item .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; letter-spacing: 1px; }
    .stat-item[data-r="1"] .num { color: #9e9e9e; }
    .stat-item[data-r="2"] .num { color: #64b5f6; }
    .stat-item[data-r="3"] .num { color: #ce93d8; }
    .stat-item[data-r="4"] .num { color: var(--star-gold); }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
    .my-card {
      border-radius: 14px;
      padding: 18px 12px;
      text-align: center;
      position: relative;
      transition: all 0.25s ease;
      cursor: default;
    }
    .my-card:hover { transform: translateY(-4px) scale(1.03); }
    .my-card .rarity-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      opacity: 0.9;
      margin-bottom: 6px;
    }
    .my-card .card-name {
      font-weight: 700;
      font-size: 14px;
      margin-top: 6px;
      color: #fff;
    }
    .my-card .card-count {
      font-size: 12px;
      margin-top: 8px;
      opacity: 0.8;
    }
    .my-card .card-time {
      font-size: 10px;
      margin-top: 6px;
      opacity: 0.5;
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .empty-state .emoji { font-size: 60px; margin-bottom: 16px; opacity: 0.6; }

    @media (max-width: 600px) {
      .stats-bar { grid-template-columns: repeat(5, 1fr); }
      .stat-item { padding: 10px 6px; }
      .stat-item .num { font-size: 16px; }
    }
  </style>
</head>
<body>
<a href="../../" class="portal-back" style="position:fixed;left:14px;top:14px;z-index:99999;background:#b388ff;color:#1a1035;text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35)">← 返回作品集</a>
  <div id="navbar"></div>
  <div class="container">
    <h2>📖 我 的 图 鉴</h2>

    <div class="stats-bar">
      <div class="stat-item" id="statTotal"><div class="num">0</div><div class="lbl">总计</div></div>
      <div class="stat-item" data-r="1" id="statN"><div class="num">0</div><div class="lbl">N</div></div>
      <div class="stat-item" data-r="2" id="statR"><div class="num">0</div><div class="lbl">R</div></div>
      <div class="stat-item" data-r="3" id="statSR"><div class="num">0</div><div class="lbl">SR</div></div>
      <div class="stat-item" data-r="4" id="statSSR"><div class="num">0</div><div class="lbl">SSR</div></div>
    </div>

    <div class="filter-bar">
      <span class="filter-label">筛选稀有度：</span>
      <button class="filter-btn active" data-r="0" onclick="filterCards(0, this)">全部</button>
      <button class="filter-btn" data-r="1" onclick="filterCards(1, this)">N</button>
      <button class="filter-btn" data-r="2" onclick="filterCards(2, this)">R</button>
      <button class="filter-btn" data-r="3" onclick="filterCards(3, this)">SR</button>
      <button class="filter-btn" data-r="4" onclick="filterCards(4, this)">SSR</button>
    </div>

    <div id="cardList" class="card-grid"></div>
  </div>

  <script src="js/demo-mock.js"></script>
  <script src="js/common.js"></script>
  <script>
    let allCards = [];

    (async () => {
      try {
        await requireRole();
        await loadNavbar();
        await filterCards(0, null);
      } catch (e) {}
    })();

    async function filterCards(rarity, btn) {
      if (btn) {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      }

      // 首次加载全部数据时，用 rarity=0 明确告诉后端不过滤
      const url = rarity > 0
        ? `/api/gacha/my-cards?rarity=${rarity}&size=100`
        : `/api/gacha/my-cards?size=100`;
      try {
        const res = await fetchJSON(url);
        const list = res.data;

        // 统计只在首次加载全部时计算一次
        if (rarity === 0) {
          allCards = list;
          updateStats(allCards);
        }
        renderCards(list);
      } catch (e) {}
    }

    function _updateStat(id, count) {
      const el = document.getElementById(id);
      if (!el) return;
      const num = el.querySelector(".num");
      if (num) num.textContent = count;
    }
    function updateStats(list) {
      _updateStat("statTotal", list.length);
      _updateStat("statN", list.filter(c => c.rarity === 1).length);
      _updateStat("statR", list.filter(c => c.rarity === 2).length);
      _updateStat("statSR", list.filter(c => c.rarity === 3).length);
      _updateStat("statSSR", list.filter(c => c.rarity === 4).length);
    }

    function renderCards(list) {
      const grid = document.getElementById("cardList");
      grid.innerHTML = "";

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <div class="emoji">🎴</div>
            <p>还没有收集到任何卡片~</p>
            <p style="margin-top:8px;font-size:13px;color:var(--star-gold)">快去 <a href="gacha.html">抽卡</a> 试试运气吧！</p>
          </div>
        `;
        return;
      }

      // 按稀有度排序
      const sorted = [...list].sort((a, b) => b.rarity - a.rarity);

      sorted.forEach(c => {
        const el = document.createElement("div");
        el.className = `my-card card-reveal rarity-${c.rarity}`;
        el.style.animation = "none";

        const badge = document.createElement("div");
        badge.className = "rarity-badge";
        badge.textContent = c.rarity_name;

        const name = document.createElement("div");
        name.className = "card-name";
        name.textContent = c.name;

        const count = document.createElement("div");
        count.className = "card-count";
        count.textContent = `× ${c.count}`;

        const time = document.createElement("div");
        time.className = "card-time";
        time.textContent = `获得于 ${fmt(c.obtain_time)}`;

        el.appendChild(badge);
        el.appendChild(name);
        el.appendChild(count);
        el.appendChild(time);
        grid.appendChild(el);
      });
    }
  </script>
</body>
</html>
