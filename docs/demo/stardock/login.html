<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星坞 StarDock —— 登录</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-box { animation: none; }
    .auth-form { display: flex; flex-direction: column; gap: 18px; }
    .auth-actions { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .auth-divider {
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 12px;
    }
    .demo-hint {
      text-align: center;
      padding: 12px;
      background: rgba(255,215,0,0.08);
      border: 1px dashed rgba(255,215,0,0.25);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .demo-hint code {
      background: rgba(255,215,0,0.15);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--star-gold);
      font-family: "Consolas", monospace;
    }
  </style>
</head>
<body>
<a href="https://37lixloirzejy43lagp.traesite.cn/" class="portal-back" style="position:fixed;left:14px;top:14px;z-index:99999;background:#b388ff;color:#1a1035;text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35)">← 返回作品集</a>
  <div class="auth-box">
    <h1>⭐ 星 坞 STAR DOCK</h1>
    <form class="auth-form" onsubmit="doLogin();return false;">
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="username" value="demo" placeholder="请输入账号" autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" value="demo123" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button type="submit" class="btn" style="width:100%;padding:14px;font-size:15px">登 录</button>
    </form>

    <div class="auth-actions" style="margin-top:18px">
      <a href="register.html">还没有账号？去注册</a>
    </div>

    <div class="auth-divider">— 演示账号 —</div>
    <div class="demo-hint">
      账号 <code>demo</code> / 密码 <code>demo123</code>（任意账号密码均可登录）<br>
      想体验管理端？账号填 <code>admin</code> 即可
    </div>
  </div>

  <script src="js/demo-mock.js"></script>
  <script src="js/common.js"></script>
  <script>
    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!username || !password) { toast("账号和密码不能为空", "warn"); return; }

      const btn = event ? event.submitter : document.querySelector(".auth-form .btn");
      btnLoading(btn, true, "登录中...");

      try {
        const res = await fetchJSON("/api/auth/login", {
          method: "POST",
          body: { username, password }
        });
        toast("✅ 登录成功！欢迎回来", "success");
        setTimeout(() => { window.location.href = "home.html"; }, 600);
      } catch (e) {
        btnLoading(btn, false);
      }
    }
  </script>
</body>
</html>
