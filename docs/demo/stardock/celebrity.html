<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明星详情 —— 星坞 StarDock</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .detail-hero {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 24px;
      min-height: 320px;
    }
    .detail-hero::before {
      content: "";
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255,215,0,0.25) 0%, transparent 50%),
        linear-gradient(135deg, #1a237e 0%, #4a148c 50%, #ff4d8a 100%);
    }
    .detail-hero::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(5,10,42,0.95) 100%);
    }

    .detail-content {
      position: relative;
      z-index: 1;
      padding: 48px 40px 32px;
    }

    .avatar-circle {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: rgba(0,0,0,0.3);
      border: 3px solid var(--star-gold);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      margin-bottom: 16px;
      box-shadow: 0 0 30px rgba(255,215,0,0.4);
    }
    .stage-name {
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
      letter-spacing: 2px;
    }
    .cat-badge {
      display: inline-block;
      padding: 4px 14px;
      background: rgba(255,215,0,0.2);
      border: 1px solid rgba(255,215,0,0.4);
      border-radius: 20px;
      font-size: 12px;
      color: var(--star-gold);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .bio-section {
      background: rgba(5, 10, 42, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,215,0,0.15);
    }
    .bio-text {
      color: var(--text-secondary);
      line-height: 1.8;
      font-size: 15px;
    }

    .stats-row {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-card {
      flex: 1;
      min-width: 140px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,215,0,0.2);
      border-radius: 14px;
      padding: 18px 20px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .stat-card .num {
      font-size: 28px;
      font-weight: 800;
      color: var(--star-gold);
    }
    .stat-card .label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .action-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-bar .btn { flex: 1; min-width: 160px; padding: 16px 24px; font-size: 15px; border-radius: 12px; }

    @media (max-width: 600px) {
      .detail-content { padding: 32px 20px 24px; }
      .stage-name { font-size: 26px; }
      .avatar-circle { width: 80px; height: 80px; font-size: 36px; }
    }
  </style>
</head>
<body>
<a href="../../" class="portal-back" style="position:fixed;left:14px;top:14px;z-index:99999;background:#b388ff;color:#1a1035;text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35)">← 返回作品集</a>
  <div id="navbar"></div>
  <div class="container">
    <div class="detail-hero" id="detailArea" style="display:none">
      <div class="detail-content">
        <div class="avatar-circle">🎤</div>
        <div class="stage-name" id="stageName"></div>
        <span class="cat-badge" id="category"></span>
      </div>
    </div>

    <div id="infoArea" style="display:none">
      <!-- 简介 -->
      <div class="bio-section">
        <div style="color:var(--star-gold);font-weight:600;margin-bottom:10px;font-size:14px;letter-spacing:1px">✦ 关 于 TA ✦</div>
        <div class="bio-text" id="bio"></div>
      </div>

      <!-- 数据 -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="num" id="fanCount">0</div>
          <div class="label">粉丝</div>
        </div>
        <div class="stat-card">
          <div class="num" id="clubMemberCount">0</div>
          <div class="label">粉丝团成员</div>
        </div>
        <div class="stat-card">
          <div class="num" id="clubName">-</div>
          <div class="label">粉丝团</div>
        </div>
      </div>

      <!-- 操作 -->
      <div class="action-bar" id="actionArea"></div>
    </div>
  </div>

  <script src="js/demo-mock.js"></script>
  <script src="js/common.js"></script>
  <script>
    let user = null;
    let clubId = null;
    let memberCount = 0;

    (async () => {
      try {
        user = await requireRole();
        await loadNavbar();

        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        if (!id) { toast("参数错误", "error"); location.href = "home.html"; return; }
        await loadDetail(id);
      } catch (e) {}
    })();

    async function loadDetail(id) {
      try {
        const res = await fetchJSON(`/api/celebrities/${id}`);
        const c = res.data;
        clubId = c.club_id;
        memberCount = c.member_count || 0;

        setText("stageName", c.stage_name);
        setText("category", c.category);
        setText("bio", c.bio || "这位明星还没有留下简介~让我们一起期待吧！");
        setText("fanCount", (c.fan_count || 0).toLocaleString());
        setText("clubMemberCount", memberCount.toLocaleString());
        setText("clubName", c.club_name || "暂未创建");

        document.getElementById("detailArea").style.display = "block";
        document.getElementById("infoArea").style.display = "block";

        const joined = await checkJoined();
        renderActions(joined);
      } catch (e) {}
    }

    async function checkJoined() {
      if (!clubId) return false;
      try {
        const res = await fetchJSON(`/api/fan-clubs/${clubId}`);
        return res.data.members.some(m => m.id === user.id);
      } catch (e) { return false; }
    }

    function renderActions(joined) {
      const area = document.getElementById("actionArea");
      if (joined) {
        const chatBtn = document.createElement("a");
        chatBtn.href = `chat.html?club_id=${clubId}`;
        chatBtn.className = "btn";
        chatBtn.textContent = "💬 进入粉丝团聊天";

        const leaveBtn = document.createElement("button");
        leaveBtn.className = "btn btn-danger";
        leaveBtn.textContent = "退出粉丝团";
        leaveBtn.onclick = leaveClub;

        area.appendChild(chatBtn);
        area.appendChild(leaveBtn);
      } else {
        const joinBtn = document.createElement("button");
        joinBtn.className = "btn";
        joinBtn.textContent = "✨ 加入粉丝团";
        joinBtn.onclick = joinClub;
        area.appendChild(joinBtn);
      }
    }

    async function joinClub() {
      try {
        await fetchJSON(`/api/fan-clubs/${clubId}/join`, { method: "POST" });
        toast("🎉 加入成功！", "success");
        document.getElementById("actionArea").innerHTML = "";
        renderActions(true);
      } catch (e) {}
    }

    async function leaveClub() {
      if (!confirm("确定要退出吗？")) return;
      try {
        await fetchJSON(`/api/fan-clubs/${clubId}/leave`, { method: "POST" });
        toast("已退出粉丝团", "success");
        document.getElementById("actionArea").innerHTML = "";
        renderActions(false);
      } catch (e) {}
    }
  </script>
</body>
</html>
